<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Não restringe script-src/style-src: a página é um único arquivo com
     <script>/<style> inline de propósito (sem build step, sem CDN), e isso
     exigiria nonce/hash por versão. object-src/base-uri/form-action não têm
     esse custo e já fecham uma classe real de abuso (plugins embutidos,
     sequestro de URL relativa via <base>, um <form> injetado enviando dados
     para fora) numa página que nunca precisa de nenhum dos três. -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="__DESCRICAO__">
<title>__TITULO__</title>
<link rel="icon" href="__FAVICON__">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f6f9; --surface:#ffffff; --surface-2:#fbfbfd;
    --ink:#17171f; --ink-soft:#66667a; --ink-faint:#9a9aab;
    --border:#e6e6ee;
    --primary:#7c3aed; --primary-ink:#ffffff; --primary-soft:#f1e9fe; --primary-soft-ink:#6d28d9;
    --warn-soft:#fdf1e3; --warn-ink:#9a5b12;
    --danger:#dc4444;
    --cat-principal:#7c3aed; --cat-principal-soft:#f1e9fe;
    --cat-sup:#b45309; --cat-sup-soft:#fdf0e1;
    --cat-aux:#0d9488; --cat-aux-soft:#e1f5f2;
    --cat-apoio:#2563eb; --cat-apoio-soft:#e7eefd;
    /* slot "neutro" (grupos sem cor própria): deriva do texto/superfície, então
       acompanha sozinho o modo escuro sem precisar de variante dedicada */
    --cat-neutro:var(--ink-soft); --cat-neutro-soft:var(--surface-2);
    --shadow-sm:0 1px 2px rgba(20,20,30,.05);
    --shadow-md:0 4px 14px rgba(20,20,30,.09);
    --shadow-lg:0 12px 40px rgba(20,20,30,.16);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111116; --surface:#191921; --surface-2:#1f1f28;
      --ink:#f1f1f6; --ink-soft:#a3a3b8; --ink-faint:#6c6c80;
      --border:#2c2c38;
      --primary:#a78bfa; --primary-ink:#171723; --primary-soft:#2a2340; --primary-soft-ink:#cbb8ff;
      --warn-soft:#3a2c17; --warn-ink:#e3ad6c;
      --danger:#f37171;
      --cat-principal:#a78bfa; --cat-principal-soft:#2a2340;
      --cat-sup:#fbbf6b; --cat-sup-soft:#3a2c17;
      --cat-aux:#5eead4; --cat-aux-soft:#173330;
      --cat-apoio:#7ba8ff; --cat-apoio-soft:#1c2740;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35); --shadow-lg:0 16px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111116; --surface:#191921; --surface-2:#1f1f28;
    --ink:#f1f1f6; --ink-soft:#a3a3b8; --ink-faint:#6c6c80;
    --border:#2c2c38;
    --primary:#a78bfa; --primary-ink:#171723; --primary-soft:#2a2340; --primary-soft-ink:#cbb8ff;
    --warn-soft:#3a2c17; --warn-ink:#e3ad6c;
    --danger:#f37171;
    --cat-principal:#a78bfa; --cat-principal-soft:#2a2340;
    --cat-sup:#fbbf6b; --cat-sup-soft:#3a2c17;
    --cat-aux:#5eead4; --cat-aux-soft:#173330;
    --cat-apoio:#7ba8ff; --cat-apoio-soft:#1c2740;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35); --shadow-lg:0 16px 44px rgba(0,0,0,.5);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{height:100%;}
  body{
    height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:var(--primary);}

  /* ---------- layout ---------- */
  #app-shell{display:flex; height:100%;}
  #sidebar{
    width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:1.1rem .9rem; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:.55rem; font-weight:800; font-size:1.02rem; padding:.3rem .4rem .3rem; margin-bottom:1.3rem;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--primary); flex:0 0 auto;}
  nav.sidenav{display:flex; flex-direction:column; gap:.15rem;}
  nav.sidenav button{
    all:unset; display:flex; align-items:center; gap:.6rem; padding:.5rem .65rem; border-radius:8px;
    font-size:.88rem; font-weight:500; color:var(--ink-soft); cursor:pointer;
  }
  nav.sidenav button .ic{font-size:1rem; width:1.1rem; text-align:center;}
  nav.sidenav button:hover{background:var(--bg); color:var(--ink);}
  nav.sidenav button.active{background:var(--primary-soft); color:var(--primary-soft-ink);}
  .sidebar-bottom{margin-top:auto; padding-top:.9rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:.5rem;}
  .save-status{font-size:.76rem; color:var(--ink-faint); padding:0 .2rem; min-height:1.1em;}
  .edit-extra{display:flex; flex-direction:column; gap:.1rem;}

  #mobile-topbar{display:none;}

  #main-area{flex:1; min-width:0; overflow-y:auto; height:100%;}
  .view{display:none; padding:1.7rem 2rem 4rem; max-width:1670px;}
  .view.active{display:block;}
  .view-head{margin-bottom:1.5rem;}
  .view-head h1{font-size:1.32rem;}
  .view-head p{color:var(--ink-soft); font-size:.9rem; margin-top:.3rem; max-width:44rem;}

  /* ---------- buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
    border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:.85rem; font-weight:600; padding:.5rem .8rem; cursor:pointer;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--primary); border-color:var(--primary); color:var(--primary-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-block{width:100%;}
  .link-btn{all:unset; color:var(--ink-soft); font-size:.8rem; cursor:pointer; padding:.15rem .2rem;}
  .link-btn:hover{color:var(--primary);}

  input.search{
    font-family:inherit; font-size:.9rem; padding:.5rem .7rem; border:1px solid var(--border); border-radius:8px;
    background:var(--surface); color:var(--ink); width:100%; max-width:22rem;
  }
  input.search:focus{outline:none; border-color:var(--primary);}

  /* ---------- diagram ---------- */
  .diagram{display:flex; flex-direction:column; gap:1.9rem;}
  .lane-head{display:flex; align-items:baseline; gap:.55rem; margin-bottom:.7rem;}
  .lane-head .lic{font-size:1.05rem;}
  .lane-head h2{font-size:1rem;}
  .lane-head .lane-sub{color:var(--ink-faint); font-size:.8rem;}
  /* a cor da raia vem do slot de paleta que o grupo escolhe em modelo.json */
  .lane[data-cor="principal"]{--lc:var(--cat-principal); --lcs:var(--cat-principal-soft);}
  .lane[data-cor="sup"]{--lc:var(--cat-sup); --lcs:var(--cat-sup-soft);}
  .lane[data-cor="aux"]{--lc:var(--cat-aux); --lcs:var(--cat-aux-soft);}
  .lane[data-cor="apoio"]{--lc:var(--cat-apoio); --lcs:var(--cat-apoio-soft);}
  .lane[data-cor="neutro"]{--lc:var(--cat-neutro); --lcs:var(--cat-neutro-soft);}
  .lane-head .lic{color:var(--lc);}

  .eco-wrap{display:flex; justify-content:center; padding:.6rem 0 .4rem;}
  .eco-ring{border:1px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex:0 0 auto;}
  .eco-chip{position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); border-radius:999px; font-size:.64rem; font-weight:600; padding:.12rem .5rem; white-space:nowrap; color:var(--ink-soft); font-family:inherit; cursor:pointer;}
  .eco-chip:hover{border-color:var(--primary); color:var(--primary);}
  .eco-core{background:var(--primary); color:var(--primary-ink); border-radius:50%; width:88%; height:88%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; text-align:center; padding:.5rem;}
  .eco-note{text-align:center; font-size:.76rem; color:var(--ink-faint); margin:0 0 1.6rem;}

  .lane-track{display:flex; flex-wrap:wrap; align-items:stretch; gap:.7rem; padding:.15rem .15rem .8rem;}

  .node-card{flex:0 0 auto; width:172px;}
  .node-card button.node{
    all:unset; display:block; width:100%; background:var(--surface); border:1px solid var(--border);
    border-top:3px solid var(--lc); border-radius:10px; padding:.7rem .75rem; cursor:pointer;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, transform .15s ease;
  }
  .node-card button.node:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
  .node-num-row{display:flex; align-items:center; justify-content:space-between; gap:.3rem; margin-bottom:.2rem;}
  .node-num{
    background:var(--lcs); color:var(--lc); border-radius:999px; flex:0 0 auto;
    width:1.3rem; height:1.3rem; display:inline-flex; align-items:center; justify-content:center;
    font-size:.66rem; font-weight:800;
  }
  .node-next{font-size:.8rem; color:var(--ink-faint); flex:0 0 auto;}
  .node-name{font-size:.83rem; font-weight:600; line-height:1.28; margin-top:.2rem;}

  /* ---------- drawer (detalhe de elo/bloco) & backdrop ---------- */
  #backdrop{position:fixed; inset:0; background:rgba(10,10,16,.4); opacity:0; pointer-events:none; transition:opacity .16s ease; z-index:39;}
  body.panel-open #backdrop{opacity:1; pointer-events:auto;}

  #drawer{
    position:fixed; top:0; right:0; height:100%; width:440px; max-width:94vw; background:var(--surface);
    box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .2s ease; z-index:41;
    display:flex; flex-direction:column;
  }
  body.drawer-open #drawer{transform:translateX(0);}
  .drawer-head{display:flex; align-items:flex-start; gap:.6rem; padding:1.2rem 1.2rem .9rem; border-bottom:1px solid var(--border);}
  .drawer-head .tag{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:.15rem .5rem; border-radius:999px; margin-bottom:.4rem; display:inline-block;}
  .drawer-title{font-size:1.1rem; font-weight:700; line-height:1.3;}
  .drawer-close{all:unset; margin-left:auto; cursor:pointer; color:var(--ink-faint); font-size:1.2rem; line-height:1; padding:.2rem;}
  .drawer-close:hover{color:var(--ink);}
  .drawer-body{flex:1; overflow-y:auto; padding:1.1rem 1.2rem 2rem;}
  .drawer-lede{color:var(--ink-soft); font-size:.9rem; margin-bottom:1.1rem;}
  .drawer-foot{padding:.9rem 1.2rem; border-top:1px solid var(--border);}

  .panel-section{margin-bottom:1.1rem;}
  .panel-label{display:block; font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:.4rem;}
  .callout{border-radius:8px; padding:.7rem .8rem; margin-bottom:1.1rem;}
  .callout.c-atores{background:var(--surface-2);}
  .callout.c-critico{background:var(--warn-soft);}
  .callout.c-critico .panel-label{color:var(--warn-ink);}

  ul.itemlist{list-style:none; margin:0; padding:0;}
  ul.itemlist li.row{position:relative; padding-left:1rem; margin-bottom:.32rem; font-size:.88rem;}
  ul.itemlist li.row::before{content:'–'; position:absolute; left:0; color:var(--ink-faint);}
  ul.itemlist li.row.add-row{padding-left:0;}
  ul.itemlist li.row.add-row::before{content:'';}
  .linklike{all:unset; cursor:pointer; color:var(--primary); text-align:left;}
  .linklike:hover, .linklike:focus-visible{text-decoration:underline;}

  /* ---------- legislação ---------- */
  .filters{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; margin-bottom:.6rem;}
  .pills{display:flex; flex-wrap:wrap; gap:.4rem;}
  .pill{font-family:inherit; font-size:.78rem; font-weight:600; padding:.28rem .68rem; border:1px solid var(--border); border-radius:999px; cursor:pointer; color:var(--ink-soft); background:var(--surface);}
  .pill:hover{border-color:var(--ink-faint);}
  .pill.active{border-color:var(--primary); color:var(--primary); background:var(--primary-soft);}
  .count{font-size:.8rem; color:var(--ink-faint); margin:.2rem 0 .8rem;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
  .table-wrap{overflow-x:auto;}
  table.normas{width:100%; border-collapse:collapse; font-size:.86rem;}
  table.normas th{text-align:left; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); border-bottom:1px solid var(--border); padding:.7rem .8rem; white-space:nowrap; background:var(--surface-2);}
  table.normas th:first-child{border-top-left-radius:var(--radius);}
  table.normas th:last-child{border-top-right-radius:var(--radius);}
  table.normas td{border-bottom:1px solid var(--border); padding:.65rem .8rem; vertical-align:top;}
  table.normas tr:last-child td{border-bottom:none;}
  table.normas td.col-actions{white-space:nowrap;}
  .badge{display:inline-block; font-size:.72rem; font-weight:600; padding:.1rem .5rem; border-radius:999px; background:var(--warn-soft); color:var(--warn-ink);}
  .fonte-edit{margin-top:.3rem; font-size:.76rem; color:var(--ink-faint);}
  .fonte-edit .fonte-label{text-transform:uppercase; font-size:.68rem; letter-spacing:.03em;}
  .fonte-url{word-break:break-all;}
  .conferir-toggle{font-size:.76rem; color:var(--ink-soft); display:inline-flex; align-items:center; gap:.3rem; margin-right:.5rem; white-space:nowrap;}

  /* ---------- siglas (dicionário de acrônimos) ----------
     A dica usa position:fixed, posicionada por JS (positionSiglaTip, perto dos
     outros addEventListener): a tabela, o painel lateral e a área principal
     têm overflow:auto, e position:fixed é a única forma confiável de escapar
     desse recorte em vez de a dica ficar cortada ou escondida atrás do
     conteúdo. O padding do lado do botão funciona como uma "ponte" invisível
     — sem ele, o cursor sai de cima do botão ao subir até o link e a dica
     fecha antes de chegar lá (o espaço entre os dois deixa de contar como
     "ainda em cima do botão"). A cor do cartão é fixa (não usa var(--ink)):
     --ink é o texto principal da página, então ele INVERTE no tema escuro
     (de quase-preto para quase-branco) para continuar legível sobre o fundo
     — um cartão com fundo var(--ink) ficaria então quase-branco no tema
     escuro, com o texto branco fixo da dica por cima: branco sobre branco.
     A dica é sempre um cartão escuro com texto claro, nos dois temas. */
  .sigla{display:inline; cursor:help; border-bottom:1px dotted var(--ink-faint);}
  .sigla:hover, .sigla:focus-visible{border-bottom-color:var(--primary);}
  .sigla-tip{position:fixed; z-index:9999; width:max-content; max-width:280px;
    padding-bottom:7px; opacity:0; pointer-events:none; transition:opacity .12s ease;}
  .sigla-tip.flip-below{padding-bottom:0; padding-top:7px;}
  .sigla-tip.is-open{opacity:1; pointer-events:auto;}
  .sigla-tip-card{display:block; background:#17171f; color:#fff; border-radius:8px;
    box-shadow:var(--shadow-md); padding:.55rem .7rem; font-size:.78rem; line-height:1.4; text-align:left;
    transform:translateY(4px); transition:transform .12s ease;}
  .sigla-tip.flip-below .sigla-tip-card{transform:translateY(-4px);}
  .sigla-tip.is-open .sigla-tip-card{transform:translateY(0);}
  .sigla-tip-card b{display:block; margin-bottom:.15rem;}
  .sigla-tip-card a{display:inline-block; margin-top:.3rem; color:#fff; font-weight:600; text-decoration:underline;}

  /* ---------- institucional ---------- */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:.9rem;}
  .info-card{padding:1rem 1.1rem;}
  .info-card h3{font-size:.94rem; margin-bottom:.55rem;}
  .sis-tag{display:block; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin-bottom:.3rem;}

  /* ---------- notas ---------- */
  .notas-card{padding:1.1rem 1.2rem; max-width:44rem;}

  /* ---------- edição ---------- */
  [contenteditable="true"]{outline:none; border-radius:4px; padding:0 .15rem; margin:0 -.15rem;}
  [contenteditable="true"]:hover{background:var(--primary-soft);}
  [contenteditable="true"]:focus{background:var(--primary-soft); box-shadow:0 0 0 1px var(--primary);}
  .add-item{background:none; border:1px dashed var(--border); color:var(--ink-faint); font-family:inherit; font-size:.82rem; padding:.15rem .6rem; border-radius:6px; cursor:pointer;}
  .add-item:hover{border-color:var(--primary); color:var(--primary);}
  .rm{background:none; border:none; color:var(--ink-faint); opacity:.6; cursor:pointer; font-size:.85rem; line-height:1; padding:0 .2rem; margin-left:.25rem;}
  .rm:hover{opacity:1; color:var(--danger);}
  body:not(.editing) .rm, body:not(.editing) .add-item{display:none;}
  body.editing .node-card button.node{box-shadow:0 0 0 1px var(--lc) inset;}

  /* ---------- responsivo ---------- */
  @media (max-width:860px){
    #sidebar{
      position:fixed; top:0; left:0; height:100%; width:264px; z-index:40; border-right:1px solid var(--border);
      transform:translateX(-100%); transition:transform .18s ease; padding-top:calc(1.1rem + env(safe-area-inset-top,0px));
    }
    body.nav-open #sidebar{transform:translateX(0);}
    #mobile-topbar{
      display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem; padding-top:calc(.7rem + env(safe-area-inset-top,0px));
      background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
    }
    #mobile-topbar .hamburger{all:unset; cursor:pointer; font-size:1.15rem; padding:.2rem .3rem; color:var(--ink);}
    #mobile-topbar .mt-title{font-weight:700; font-size:.95rem;}
    #app-shell{display:block; height:auto; min-height:100%;}
    #main-area{height:auto; overflow-y:visible;}
    .view{padding:1.3rem 1rem 5rem;}
    #drawer{width:100%; max-width:100%;}
  }
  @media (max-width:520px){
    body{font-size:14px;}
    .view-head h1{font-size:1.16rem;}
  }
</style>
</head>
<body>

<div id="backdrop"></div>

<div id="app-shell">
  <aside id="sidebar">
    <div class="brand" id="brand"></div>
    <nav class="sidenav" id="sidenav"></nav>
    <div class="sidebar-bottom">
      <div id="save-status" class="save-status"></div>
      <div id="edit-extra" class="edit-extra"></div>
      <button type="button" id="edit-toggle" class="btn btn-block">✎ Editar conteúdo</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </aside>

  <div id="main-area">
    <div id="mobile-topbar">
      <button type="button" class="hamburger" id="hamburger" aria-label="Abrir menu">☰</button>
      <span class="mt-title" id="mt-title"></span>
    </div>
    <!-- as seções (section.view) são geradas por buildChrome() a partir de modelo.vistas -->
  </div>
</div>

<div id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-name">
  <div class="drawer-head">
    <div>
      <span class="tag" id="drawer-tag"></span>
      <h3 class="drawer-title"><span class="text" id="drawer-name" data-path=""></span></h3>
    </div>
    <button type="button" class="drawer-close" id="drawer-close" aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</div>

<script>
"use strict";

/* ---------- dados iniciais (semente) ---------- */
const SEED = __SEED_JSON__;
// Hash do conteúdo deste build (ver build.py) -- não é o "atualizado em" de
// meta.json (editorial, muda a cada salvamento local); esta marca é sobre QUAL
// conteúdo publicado é este arquivo, e só muda quando o conteúdo de verdade
// muda. init() usa isto pra saber se uma cópia salva no navegador (local ou
// na capacidade db) já ficou desatualizada em relação a uma versão mais nova
// deste site -- sem isso, uma edição local antiga (mesmo que só acidental)
// blindava esse navegador contra qualquer atualização de conteúdo publicada
// depois, pra sempre, até alguém lembrar de clicar em "Restaurar".
const SEED_VERSION = "__SEED_VERSION__";
function cloneSeed() { return JSON.parse(JSON.stringify(SEED)); }

/* ---------- estado ---------- */
let state = cloneSeed();
let editing = false;
let filters = { q: "", esfera: "", elo: "" };
let currentView = SEED.modelo.vistas[0].id; // a primeira vista de modelo.vistas é a inicial
let openBlocoIndex = null;
let drawerOpenerEl = null; // elemento que tinha o foco antes de abrir o drawer (ver closeDrawer)
let openSistemaId = null;
let db = null, dbMode = null, downloadsCap = null;

/* ---------- utilidades de caminho ---------- */
function getPath(obj, path) {
  if (!path) return obj;
  return path.split(".").reduce((cur, seg) => {
    if (cur == null) return undefined;
    return cur[/^\d+$/.test(seg) ? Number(seg) : seg];
  }, obj);
}
function setPath(obj, path, value) {
  const parts = path.split(".");

  parent[/^\d+$/.test(last) ? Number(last) : last] = value;
}

  const parts = path.split(".");
  const last = parts.pop();
  const parent = getPath(obj, parts.join("."));

/* ---------- elos: parse/format ---------- */
/* As etiquetas de elo que uma norma pode ter (e1…e10, auxiliar, apoio, ...)
   são definidas em state.modelo.elos: cada uma tem id, abreviação (como aparece
   e se digita na tabela) e, opcionalmente, apelidos aceitos na digitação. O
   reconhecimento é EXATO (id, abreviação ou apelido, sem diferenciar
   maiúsculas); o que não casa com nenhum elo é descartado. */
function eloDef(id) { return state.modelo.elos.find(e => e.id === id) || null; }
function parseElosText(text) {
  const elos = state.modelo.elos;
  const out = [];
  text.split(/[,;]+/).map(s => s.trim().toLowerCase()).filter(Boolean).forEach(tok => {
    if (tok === "todos" || tok === "t") { elos.forEach(e => out.push(e.id)); return; }
    const hit = elos.find(e => e.id.toLowerCase() === tok || e.abrev.toLowerCase() === tok ||
      (e.apelidos || []).some(a => a.toLowerCase() === tok));
    if (hit) out.push(hit.id);
  });
  return [...new Set(out)];
}
function formatElosShort(arr) {
  return (arr || []).map(id => { const e = eloDef(id); return e ? e.abrev : id; }).join(", ");
}
function eloLabel(id) {
  const e = eloDef(id);
  if (!e) return id;
  if (e.tipo === "agregado") return e.rotulo;
  const b = state.blocos.find(x => x.id === id);
  return e.abrev + (b ? " · " + b.nome : "");
}

/* ---------- helper de DOM (sem innerHTML) ---------- */
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  if (children != null) {
    if (Array.isArray(children)) children.forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    else if (typeof children === "string") e.textContent = children;
    else e.appendChild(children);
  }
  return e;
}
// Nomes legíveis para os campos mais comuns, usados por pathToLabel() abaixo.
// Um campo que não está aqui ainda ganha um rótulo (o próprio nome do campo no
// path), só menos natural -- é o atalho de um único lugar cobrindo todos os
// ~30 pontos que chamam editableSpan(), em vez de escrever um aria-label à mão
// em cada campo editável do site.
const FIELD_LABELS = {
  esfera: "Esfera", titulo: "Título", resumo: "Resumo", fonte: "Fonte (link da norma)",
  elos: "Elos (ids separados por vírgula)", nome: "Nome", itens: "Item",
};
function pathToLabel(path) {
  const parts = path.split(".");
  const last = parts[parts.length - 1];
  let human = FIELD_LABELS[last] || last;
  // Campos de uma norma levam o nome das colunas da vista de normas (que é
  // dado do documento); o sufixo explicativo de "elos" é texto do editor.
  const nv = parts[0] === "normas" ? vistaDoTipo("normas") : null;
  if (nv && nv.colunas[last]) human = last === "elos" ? nv.colunas.elos + " (ids separados por vírgula)" : nv.colunas[last];
  return (parts.length >= 3 && /^\d+$/.test(parts[1])) ? `${human} (${parts[0]}, item ${Number(parts[1]) + 1})` : human;
}
function editableSpan(cls, path, text, extraAttrs) {
  const attrs = Object.assign({ class: cls, "data-path": path, contenteditable: editing ? "true" : null }, extraAttrs || {});
  // Sem isto, um leitor de tela só anuncia "texto editável", sem dizer qual
  // campo é -- só faz sentido no modo de edição (fora dele o span não é
  // editável, e o próprio texto já é o nome acessível do elemento).
  if (editing && !attrs["aria-label"]) attrs["aria-label"] = pathToLabel(path);
  // no modo de edição o campo fica como texto puro (edição permanece simples);
  // fora dele, siglas conhecidas ganham a dica com expansão e link.
  return el("span", attrs, editing ? (text || "") : wrapSiglas(text || ""));
}

/* ---------- siglas (dicionário de acrônimos) ----------
   wrapSiglas() troca, dentro de um texto livre, cada ocorrência de uma sigla
   cadastrada em siglas.json por um botão com dica (expansão + link oficial),
   sem innerHTML: cada pedaço vira um nó de texto ou um <button> de verdade. */
let SIGLA_RE = null;
function siglaRegex() {
  if (SIGLA_RE !== null) return SIGLA_RE;
  const keys = Object.keys(state.siglas || {}).sort((a, b) => b.length - a.length);
  if (!keys.length) { SIGLA_RE = undefined; return SIGLA_RE; }
  const esc = keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  SIGLA_RE = new RegExp("\\b(" + esc.join("|") + ")\\b", "g");
  return SIGLA_RE;
}
// Links vêm de dados importáveis (JSON que qualquer pessoa pode editar e
// compartilhar), então nunca viram href sem passar por aqui: só http/https
// é aceito, o resto (ex.: "javascript:...") vira texto em vez de link.
function safeHref(url) {
  return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
}
let siglaIdSeq = 0;
function siglaNode(token) {
  const info = state.siglas[token];
  const card = el("span", { class: "sigla-tip-card" });
  card.appendChild(el("b", {}, token));
  card.appendChild(document.createTextNode(" — " + info.expansao));
  const href = safeHref(info.url);
  if (href) card.appendChild(el("a", { href, target: "_blank", rel: "noopener" }, "Site institucional ↗"));
  const tipId = "sigla-tip-" + (++siglaIdSeq);
  const tip = el("span", { class: "sigla-tip", id: tipId, role: "tooltip" }, card);
  // <span>, não <button>: um <button> com um <a> dentro é inválido no modelo de
  // conteúdo do HTML (conteúdo interativo dentro de conteúdo interativo) — e o
  // título de uma norma pode envolver a sigla inteira num <a> da fonte (ver
  // buildNormaRow), o que tornaria isso um <a> dentro de um <a>. Um span com
  // tabindex continua focável (Tab chega até ele, abrindo a dica como um botão
  // faria), só sem anunciar pra tecnologia assistiva uma ação que ele não tem;
  // aria-describedby é o que liga o span à dica para quem usa leitor de tela.
  return el("span", { class: "sigla", tabindex: "0", "aria-describedby": tipId }, [token, tip]);
}
function wrapSiglas(text, wrapPlain) {
  const mk = wrapPlain || (s => document.createTextNode(s));
  if (!text) return [mk("")];
  const re = siglaRegex();
  if (!re) return [mk(text)];
  re.lastIndex = 0;
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(mk(text.slice(last, m.index)));
    out.push(siglaNode(m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(mk(text.slice(last)));
  return out;
}

/* ---------- diagrama ---------- */
/* Grupos (raias), sistemas de contexto e etiquetas de elo vêm de modelo.json
   (state.modelo) — nada disso é fixo no código. Atalhos de leitura: */
function modeloGrupo(id) { return state.modelo.grupos.find(g => g.id === id) || null; }
function sistemaMatches(id) { return state.blocos.map((b, i) => ({ b, i })).filter(({ b }) => (b.sistemas || []).includes(id)); }
function buildEcosystem() {
  const outer = Math.max(220, Math.min(440, (window.innerWidth || 440) - 48));
  const inner = Math.round(outer * (140 / 440));
  const sistemas = state.modelo.sistemas;
  const step = (outer - inner) / Math.max(1, sistemas.length - 1);
  let parent = null, root = null;
  sistemas.forEach((s, i) => {
    const size = Math.round(outer - i * step);
    const ring = el("div", { class: "eco-ring", style: `width:${size}px;height:${size}px;` });
    ring.appendChild(el("button", { type: "button", class: "eco-chip", "data-sistema": s.id, title: state.modelo.ecossistema.dicaChip }, s.nome));
    if (parent) parent.appendChild(ring); else root = ring;
    parent = ring;
  });
  parent.appendChild(el("div", { class: "eco-core" }, state.modelo.ecossistema.nucleo));
  const wrap = el("div", { class: "eco-wrap" }, root);
  const note = el("p", { class: "eco-note" }, wrapSiglas(state.modelo.ecossistema.nota));
  const box = el("div", {});
  box.appendChild(wrap);
  box.appendChild(note);
  return box;
}
function buildDiagram(v) {
  const wrap = el("div");
  // os componentes da vista, na ordem em que ela os lista
  v.componentes.forEach(c => {
    if (c === "ecossistema") wrap.appendChild(buildEcosystem());
    // uma raia por grupo do modelo (na ordem do modelo) que pede raia
    else if (c === "raias") state.modelo.grupos.filter(g => g.raia).forEach(g => wrap.appendChild(buildLane(g)));
  });
  return wrap;
}
function buildLane(g) {
  const lane = el("div", { class: "lane", "data-lane": g.id, "data-cor": g.cor });
  const head = el("div", { class: "lane-head" });
  head.appendChild(el("span", { class: "lic" }, g.icone));
  head.appendChild(el("h2", {}, g.nome));
  head.appendChild(el("span", { class: "lane-sub" }, "— " + g.subtitulo));
  lane.appendChild(head);
  const track = el("div", { class: "lane-track" });
  const items = state.blocos.map((b, i) => ({ b, i })).filter(({ b }) => b.grupo === g.id);
  items.forEach(({ b, i }, idx) => {
    track.appendChild(buildNodeCard(b, i, g.sequencial ? idx + 1 : null, g.sequencial && idx < items.length - 1));
  });
  lane.appendChild(track);
  return lane;
}
function buildNodeCard(b, i, num, showNext) {
  const wrapEl = el("div", { class: "node-card" });
  const btn = el("button", { type: "button", class: "node", "data-node-id": b.id, "data-open-bloco": i });
  if (num) {
    const row = el("div", { class: "node-num-row" });
    row.appendChild(el("span", { class: "node-num" }, String(num).padStart(2, "0")));
    if (showNext) row.appendChild(el("span", { class: "node-next", "aria-hidden": "true" }, "→"));
    btn.appendChild(row);
  }
  btn.appendChild(el("div", { class: "node-name" }, b.nome));
  wrapEl.appendChild(btn);
  return wrapEl;
}
function updateNodeCardLabel(i) {
  const b = state.blocos[i];
  document.querySelectorAll('[data-open-bloco="' + i + '"] .node-name').forEach(n => { n.textContent = b.nome; });
}

/* ---------- painel de detalhe (drawer) ---------- */
function buildPanelSection(s, path) {
  const box = el("div", { class: "panel-section" });
  box.appendChild(editableSpan("panel-label text", path + ".titulo", s.titulo));
  box.appendChild(buildEditableList(s.itens, path + ".itens"));

}
function buildCallout(s, path, variant) {

  box.appendChild(editableSpan("panel-label text", path + ".titulo", s.titulo));
  box.appendChild(buildEditableList(s.itens, path + ".itens"));

}
function buildEditableList(itens, path) {
  const ul = el("ul", { class: "itemlist" });
  itens.forEach((txt, i) => {
    const li = el("li", { class: "row" });
    li.appendChild(editableSpan("text", `${path}.${i}`, txt));
    if (editing) li.appendChild(el("button", { class: "rm", type: "button", "data-remove-path": `${path}.${i}`, "aria-label": "remover item" }, "×"));
    ul.appendChild(li);
  });
  if (editing) ul.appendChild(el("li", { class: "row add-row" }, el("button", { class: "add-item", type: "button", "data-add-path": path }, "+ adicionar")));
  return ul;
}
function catTagInfo(grupo) {

}
function renderDrawer() {
  if (openBlocoIndex != null) return renderBlocoDrawerContent();
  if (openSistemaId != null) return renderSistemaDrawerContent();
}
function renderBlocoDrawerContent() {
  const b = state.blocos[openBlocoIndex];
  const [tagText, tagBg, tagFg] = catTagInfo(b.grupo);
  const tag = document.getElementById("drawer-tag");
  tag.textContent = tagText; tag.style.background = tagBg; tag.style.color = tagFg;

  const nameEl = document.getElementById("drawer-name");
  nameEl.textContent = b.nome;
  nameEl.setAttribute("data-path", `blocos.${openBlocoIndex}.nome`);
  if (editing) { nameEl.setAttribute("contenteditable", "true"); nameEl.setAttribute("aria-label", "Nome"); }
  else { nameEl.removeAttribute("contenteditable"); nameEl.removeAttribute("aria-label"); }

  const body = document.getElementById("drawer-body");
  body.replaceChildren();
  if (b.resumo) {
    const p = el("p", { class: "drawer-lede" });
    p.appendChild(editableSpan("text", `blocos.${openBlocoIndex}.resumo`, b.resumo));
    body.appendChild(p);
  }
  const mainSecs = [], calloutSecs = [];
  b.secoes.forEach((s, si) => (s.margem ? calloutSecs : mainSecs).push({ s, si }));
  mainSecs.forEach(({ s, si }) => body.appendChild(buildPanelSection(s, `blocos.${openBlocoIndex}.secoes.${si}`)));
  calloutSecs.forEach(({ s, si }, idx) => body.appendChild(buildCallout(s, `blocos.${openBlocoIndex}.secoes.${si}`, idx === 0 ? "atores" : "critico")));

  const foot = document.getElementById("drawer-foot");
  foot.replaceChildren();
  // Um bloco que é ele mesmo um elo (modelo.elos, tipo "bloco") filtra pelo
  // próprio id, em qualquer grupo em que esteja exibido (e1-e4 ficam na raia de
  // suprimentos mas continuam tendo normas marcadas com o próprio id). Os
  // demais filtram pelo elo agregado que o GRUPO indica (grupo.filtroElo); sem
  // nenhum dos dois, não há botão. Os botões são da vista de normas (é ela que
  // os nomeia e para onde saltam): sem uma vista dessas, não existem.
  const nv = vistaDoTipo("normas");
  if (!nv) return;
  const elo = eloDef(b.id);
  const grp = modeloGrupo(b.grupo);
  if (elo && elo.tipo === "bloco") foot.appendChild(el("button", { class: "btn btn-block", type: "button", "data-filter-elo": b.id }, nv.rotulos.verElo));
  else if (grp && grp.filtroElo) foot.appendChild(el("button", { class: "btn btn-block", type: "button", "data-filter-elo": grp.filtroElo }, nv.rotulos.verAplicavel));
}
function renderSistemaDrawerContent() {

function openDrawer(i) {
  drawerOpenerEl = document.activeElement;
  openBlocoIndex = i; openSistemaId = null;
  renderDrawer();
  document.body.classList.add("panel-open", "drawer-open");

function openSistemaDrawer(id) {
  drawerOpenerEl = document.activeElement;

  renderDrawer();
  document.body.classList.add("panel-open", "drawer-open");

function closeDrawer() {
  const wasOpen = document.body.classList.contains("drawer-open");
  document.body.classList.remove("drawer-open");
  if (!document.body.classList.contains("nav-open")) document.body.classList.remove("panel-open");
  openBlocoIndex = null; openSistemaId = null;
  document.getElementById("drawer-body").replaceChildren();
  document.getElementById("drawer-foot").replaceChildren();
  // devolve o foco pra quem abriu o drawer (o card ou item de sistema
  // clicado) -- sem isto, depois de fechar via teclado o foco do navegador

function openNav() { document.body.classList.add("panel-open", "nav-open"); }

}

/* ---------- casca do documento: identidade + vistas ----------
   Marca, título da página, menu e as seções (section.view) vêm de state.meta e
   de state.modelo.vistas — a ordem do menu é a da lista, a primeira vista é a
   inicial. Cada vista tem um tipo (diagrama, normas, cartoes, lista) que decide
   o que ela contém e qual renderizador a desenha. buildChrome() só refaz a
   casca quando a assinatura (título + vistas) muda: cobre init(), importar,
   restaurar e desfazer, que trocam o estado inteiro. */
function vistaDef(id) { return state.modelo.vistas.find(v => v.id === id) || null; }
function vistaDoTipo(tipo) { return state.modelo.vistas.find(v => v.tipo === tipo) || null; }
// ids dos contêineres que cada vista preenche (os de tipos únicos — diagrama e
// normas — têm id fixo; os demais derivam do id da vista)
function containersOf(v) {
  if (v.tipo === "diagrama") return ["diagram"];
  if (v.tipo === "normas") return ["normas-tbody", "pills", "normas-add"];
  if (v.tipo === "cartoes") return ["cartoes-" + v.id];
  return ["lista-" + v.id];
}
function buildViewSection(v) {
  const sec = el("section", { class: "view", id: "view-" + v.id });
  const head = el("div", { class: "view-head" });
  head.appendChild(el("h1", {}, v.titulo));
  head.appendChild(el("p"));
  sec.appendChild(head);
  if (v.tipo === "diagrama") {
    sec.appendChild(el("div", { class: "diagram", id: "diagram" }));
  } else if (v.tipo === "normas") {
    const bar = el("div", { class: "filters" });
    const search = el("input", { type: "search", id: "search", class: "search", placeholder: v.rotulos.busca, "aria-label": v.rotulos.buscaAria });
    search.value = filters.q;
    bar.appendChild(search);
    bar.appendChild(el("div", { id: "pills", class: "pills" }));
    sec.appendChild(bar);
    sec.appendChild(el("p", { id: "normas-count", class: "count" }));
    const tr = el("tr");
    ["esfera", "norma", "resumo", "elos"].forEach(k => tr.appendChild(el("th", {}, v.colunas[k])));
    tr.appendChild(el("th", { class: "col-actions" }));
    const table = el("table", { class: "normas" }, [el("thead", {}, tr), el("tbody", { id: "normas-tbody" })]);
    sec.appendChild(el("div", { class: "card table-wrap" }, table));
    sec.appendChild(el("div", { id: "normas-add", style: "margin-top:.8rem;" }));
  } else if (v.tipo === "cartoes") {

  } else {

  }

}
// A introdução é texto simples (siglas expandidas); o token {aConferir} vira o
// selo, construído por DOM (nunca innerHTML), com o rótulo da vista de normas.
function fillIntro(v) {
  const p = document.querySelector("#view-" + v.id + " .view-head p");
  if (!p) return;
  const nv = vistaDoTipo("normas");
  const selo = nv ? nv.rotulos.aConferir : "a conferir";
  const nodes = [];
  v.intro.split("{aConferir}").forEach((txt, i) => {
    if (i > 0) nodes.push(el("span", { class: "badge" }, selo));
    if (txt !== "") nodes.push(...wrapSiglas(txt));
  });
  p.replaceChildren(...nodes);
}
function applyActiveView() {
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + currentView));
  document.querySelectorAll("nav.sidenav button").forEach(b => b.classList.toggle("active", b.getAttribute("data-view") === currentView));
  const v = vistaDef(currentView);
  document.getElementById("mt-title").textContent = v ? v.rotulo : "";
}
let chromeSig = null;
function buildChrome() {
  const sig = JSON.stringify([state.meta.titulo, state.modelo.vistas]);
  if (sig === chromeSig) return;
  const vistas = state.modelo.vistas;
  if (!vistaDef(currentView)) currentView = vistas[0].id;
  document.title = state.meta.titulo;
  document.getElementById("brand").replaceChildren(el("span", { class: "dot" }), document.createTextNode(state.meta.titulo));
  document.getElementById("sidenav").replaceChildren(...vistas.map(v =>
    el("button", { type: "button", "data-view": v.id }, [el("span", { class: "ic" }, v.icone), v.rotulo])));
  const main = document.getElementById("main-area");
  main.querySelectorAll(":scope > section.view").forEach(s => s.remove());
  vistas.forEach(v => { main.appendChild(buildViewSection(v)); fillIntro(v); });
  applyActiveView();
  chromeSig = sig; // só depois de pronta: se algo acima falhar, a próxima chamada refaz a casca
}

/* ---------- navegação entre views ---------- */
function switchView(name) {
  if (!vistaDef(name)) return;
  currentView = name;
  applyActiveView();
  closeDrawer();
  closeNav();
  renderAll();
}

    if (!ids.every(isTxt) || new Set(ids).size !== ids.length) return false;
  }
  const eloIds = new Set(m.elos.map(e => e.id));
  for (const g of m.grupos) {
    if (!isTxt(g.etiqueta) || !COR_SLOTS.includes(g.cor)) return false;
    if (typeof g.sequencial !== "boolean" || typeof g.raia !== "boolean") return false;
    if (g.raia && !(isTxt(g.nome) && isTxt(g.icone) && isTxt(g.subtitulo))) return false;
    if (g.filtroElo !== undefined && !eloIds.has(g.filtroElo)) return false;
  }
  for (const s of m.sistemas) { if (!isTxt(s.nome) || !isTxt(s.desc)) return false; }
  const tokens = new Map();
  for (const e of m.elos) {
    if (e.tipo !== "bloco" && e.tipo !== "agregado") return false;
    if (!isTxt(e.abrev)) return false;
    if (e.tipo === "agregado" && !isTxt(e.rotulo)) return false;
    if (e.apelidos !== undefined && !(Array.isArray(e.apelidos) && e.apelidos.every(isTxt))) return false;
    for (const t of [e.id, e.abrev, ...(e.apelidos || [])]) {
      const k = t.trim().toLowerCase();
      if (k === "todos" || k === "t") return false;
      if (tokens.has(k) && tokens.get(k) !== e.id) return false;
      tokens.set(k, e.id);
    }
  }
  const eco = m.ecossistema;
  if (!(isObj(eco) && isTxt(eco.nucleo) && isTxt(eco.nota) && isTxt(eco.semItem) && isTxt(eco.dicaChip))) return false;
  return validVistas(m.vistas, new Set(m.grupos.map(g => g.id)));
}
// Espelham as constantes de mesmo nome do build.py (o TIPO de uma vista é código:
// um renderizador no template; o resto é dado).
const TIPOS_VISTA = ["diagrama", "normas", "cartoes", "lista"];
const COMPONENTES_DIAGRAMA = ["ecossistema", "raias"];
const FONTES_LISTA = ["notas"];
const COLUNAS_NORMAS = ["esfera", "norma", "resumo", "elos"];
const ROTULOS_NORMAS = ["busca", "buscaAria", "contagem", "adicionar", "filtroElo", "aConferir", "verElo", "verAplicavel"];
// Mesmas regras de validate_vistas() do build.py. Diagrama e normas têm ids de
// DOM únicos no template, então cada um aparece no máximo uma vez.
function validVistas(vistas, grupoIds) {
  const isTxt = v => typeof v === "string" && v.trim() !== "";
  const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
  if (!Array.isArray(vistas) || vistas.length === 0 || !vistas.every(isObj)) return false;
  const ids = new Set();
  let diagramas = 0, normas = 0;
  for (const v of vistas) {
    if (typeof v.id !== "string" || !/^[a-z][a-z0-9-]*$/.test(v.id) || ids.has(v.id)) return false;
    ids.add(v.id);
    if (!TIPOS_VISTA.includes(v.tipo)) return false;
    if (!isTxt(v.rotulo) || !isTxt(v.icone) || !isTxt(v.titulo) || typeof v.intro !== "string") return false;
    if (v.tipo === "diagrama") {
      const c = v.componentes;
      if (!Array.isArray(c) || c.length === 0 || !c.every(x => COMPONENTES_DIAGRAMA.includes(x)) || new Set(c).size !== c.length) return false;
      diagramas++;
    } else if (v.tipo === "normas") {
      if (!isObj(v.colunas) || !COLUNAS_NORMAS.every(k => isTxt(v.colunas[k]))) return false;
      if (!Array.isArray(v.ordemEsferas) || !v.ordemEsferas.every(isTxt)) return false;
      if (!isObj(v.rotulos) || !ROTULOS_NORMAS.every(k => isTxt(v.rotulos[k]))) return false;
      if (!v.rotulos.contagem.includes("{total}") || !v.rotulos.contagem.includes("{visiveis}")) return false;
      normas++;
    } else if (v.tipo === "cartoes") {
      if (typeof v.grupo !== "string" || !grupoIds.has(v.grupo)) return false;
    } else if (!FONTES_LISTA.includes(v.fonte)) return false;
  }
  return diagramas <= 1 && normas <= 1;
}
// Compatibilidade com exports de antes da Fase 3: um modelo sem `vistas` (ou sem
// `ecossistema.dicaChip`) é completado com o do build — campo a campo, nunca por
// Object.assign/spread de um objeto vindo do arquivo (uma chave literal
// "__proto__" trocaria o protótipo). Se o resultado não passar em validModelo
// (ex.: as vistas do build apontam para um grupo que o modelo importado não tem),
// o arquivo é rejeitado: não há como adivinhar vistas para um modelo desconhecido.
function completeModelo(m) {
  if (!m || typeof m !== "object" || Array.isArray(m)) return m;
  const eco = m.ecossistema;
  const sd = JSON.parse(JSON.stringify(SEED.modelo)); // cópia: o estado nunca compartilha objetos com SEED
  return {
    grupos: m.grupos, sistemas: m.sistemas, elos: m.elos,
    ecossistema: (eco && typeof eco === "object" && !Array.isArray(eco))
      ? { nucleo: eco.nucleo, nota: eco.nota, semItem: eco.semItem, dicaChip: eco.dicaChip !== undefined ? eco.dicaChip : sd.ecossistema.dicaChip }
      : eco,
    vistas: m.vistas !== undefined ? m.vistas : sd.vistas,
  };
}
// O modelo que um arquivo importado passaria a ter (ou o do build, se não traz um).
function importedModelo(obj) {
  return obj.modelo !== undefined ? completeModelo(obj.modelo) : JSON.parse(JSON.stringify(SEED.modelo));
}
// Identidade do documento. `slug` é sempre o da semente (ver LOCAL_KEY); título,
// ícone e subtítulo vêm do arquivo quando são textos não vazios (export de antes
// da Fase 3 não os tem: ficam os do build). Campo a campo; chaves desconhecidas
// (ex.: o antigo meta.intro, que passou a ser a introdução da vista Cadeia) saem.
function completeMeta(m) {
  const sm = SEED.meta;
  const out = { slug: sm.slug };
  for (const k of ["titulo", "icone", "subtitulo"]) out[k] = (typeof m[k] === "string" && m[k].trim() !== "") ? m[k] : sm[k];
  out.margem = (Array.isArray(m.margem) && m.margem.every(s => typeof s === "string")) ? m.margem : (sm.margem || []).slice();
  out.atualizado = typeof m.atualizado === "string" ? m.atualizado : sm.atualizado;
  return out;
}
// Confere não só a presença de meta/blocos/normas/notas (forma de alto nível),
// mas o tipo de cada campo que o render de fato lê — um JSON importado é
// conteúdo de fora, então um item malformado (ex.: um bloco nulo, ou uma
// norma sem elos) precisa ser rejeitado aqui, antes de entrar em `state`,
// em vez de quebrar no meio do render com `state` já mutado.
function validShape(obj) {
  if (!obj || typeof obj !== "object") return false;
  if (!obj.meta || typeof obj.meta !== "object" || Array.isArray(obj.meta)) return false;
  // identidade: se o arquivo traz título/ícone/subtítulo, têm que ser textos não
  // vazios (ausentes, valem os do build — ver completeMeta); o slug do arquivo é ignorado
  for (const k of ["titulo", "icone", "subtitulo"]) {
    const v = obj.meta[k];
    if (v !== undefined && !(typeof v === "string" && v.trim() !== "")) return false;
  }
  if (!Array.isArray(obj.blocos) || !Array.isArray(obj.normas) || !Array.isArray(obj.notas)) return false;
  const isStr = v => typeof v === "string";
  for (const b of obj.blocos) {
    if (!b || typeof b !== "object" || !isStr(b.id) || !isStr(b.grupo) || !isStr(b.nome)) return false;
    if (b.secoes !== undefined) {
      if (!Array.isArray(b.secoes)) return false;
      for (const s of b.secoes) {
        if (!s || typeof s !== "object" || !isStr(s.titulo) || !Array.isArray(s.itens)) return false;
      }
    }
    if (b.sistemas !== undefined && !Array.isArray(b.sistemas)) return false;
  }
  for (const n of obj.normas) {
    if (!n || typeof n !== "object" || !isStr(n.esfera) || !isStr(n.titulo) || !Array.isArray(n.elos)) return false;
    if (n.fonte !== undefined && !isStr(n.fonte)) return false;
    if (n.status !== undefined && n.status !== "ok" && n.status !== "conferir") return false;
  }
  for (const nota of obj.notas) { if (!isStr(nota)) return false; }
  if (obj.siglas !== undefined) {
    if (!obj.siglas || typeof obj.siglas !== "object" || Array.isArray(obj.siglas)) return false;
    for (const key of Object.keys(obj.siglas)) {
      const info = obj.siglas[key];
      if (!info || typeof info !== "object" || !isStr(info.expansao) || !info.expansao.trim()) return false;
      if (info.url !== undefined && !isStr(info.url)) return false;
    }
  }
  // O modelo: se o arquivo traz um, ele (completado, se for de antes das vistas)
  // tem que ser válido; se não traz (export de antes do modelo existir), vale o
  // do build. Em qualquer caso, blocos e normas só podem apontar para grupos,
  // sistemas e elos que esse modelo define (o build.py faz a mesma checagem nos
  // arquivos de dados).
  const modelo = importedModelo(obj);
  if (!validModelo(modelo)) return false;
  const grupoIds = new Set(modelo.grupos.map(g => g.id));
  const sistemaIds = new Set(modelo.sistemas.map(s => s.id));
  const eloIds = new Set(modelo.elos.map(e => e.id));
  for (const b of obj.blocos) {
    if (!grupoIds.has(b.grupo)) return false;
    if (b.sistemas !== undefined && !b.sistemas.every(sid => isStr(sid) && sistemaIds.has(sid))) return false;
  }
  for (const n of obj.normas) {
    if (!n.elos.every(eid => isStr(eid) && eloIds.has(eid))) return false;
  }
  return true;
}
async function handleImportFile(file) {
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch (err) { alert("Não foi possível ler este arquivo. Confira se é um JSON exportado por \"" + SEED.meta.titulo + "\"."); return; }
  if (!validShape(parsed)) { alert("Este arquivo não tem o formato esperado, ou algum item dentro dele (bloco, norma, sigla...) está incompleto."); return; }
  const seed = cloneSeed();
  const atualizado = (parsed.meta && typeof parsed.meta.atualizado === "string") ? `Atualizado em: ${parsed.meta.atualizado}\n` : "";
  const resumo = `${atualizado}Blocos: ${parsed.blocos.length} · Normas: ${parsed.normas.length} · Notas: ${parsed.notas.length}`;
  if (!confirm(`Importar este arquivo vai substituir todo o conteúdo atual por ele.\n\n${resumo}\n\nContinuar?`)) return;
  undoSnapshot = JSON.stringify(state);
  // Monta o novo estado campo a campo (nunca Object.assign({}, seed, parsed), que
  // copiaria QUALQUER chave de nível superior do arquivo importado, inclusive uma
  // chave literal "__proto__" — um arquivo JSON malicioso poderia usar isso para
  // trocar o protótipo do objeto `state` resultante). Aqui só os 6 campos
  // esperados são lidos do arquivo; o resto do conteúdo importado é ignorado.
  state = {
    meta: completeMeta(parsed.meta), blocos: parsed.blocos, normas: parsed.normas, notas: parsed.notas,
    siglas: (parsed.siglas && typeof parsed.siglas === "object") ? parsed.siglas : seed.siglas,
    // completado como em validShape (export de antes das vistas, ou do modelo)
    modelo: importedModelo(parsed),
  };
  SIGLA_RE = null; // o conjunto de siglas pode ter mudado — invalida o cache (ver siglaRegex)
  closeDrawer();
  try {
    renderAll();
  } catch (err) {
    // Passou pelo validShape mas ainda assim quebrou ao desenhar a tela (um
    // caso que a validação não previu). Em vez de deixar a página num estado
    // quebrado e arriscar persistir isso no próximo salvamento automático,
    // volta para a seed original agora mesmo — e, como isso acontece antes do
    // scheduleSave() abaixo, nada do conteúdo quebrado chega a ser salvo.
    state = seed;
    SIGLA_RE = null;
    renderAll();
    updateEditControls();
    alert("O arquivo importado causou um erro ao exibir o conteúdo. A importação foi desfeita e o conteúdo original foi restaurado.");
    return;
  }
  updateEditControls();
  scheduleSave();
}

/* ---------- persistência: capacidade db, com alternativa local ---------- */
// O slug vem SEMPRE da semente (meta.json do build), nunca do estado nem de um
// arquivo importado: é ele que decide onde este documento guarda os dados no
// navegador, e um arquivo de fora não pode redirecionar esse armazenamento.
const LOCAL_KEY = SEED.meta.slug + ":content/main";
function makeLocalDb() {
  return {
    doc: () => ({
      get: async () => {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (raw == null) return { exists: false, data: () => undefined };
        return { exists: true, data: () => JSON.parse(raw) };
      },
      set: async (data) => { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); },
    }),
  };
}
let saveTimer = null, saving = false, pendingAgain = false;
function scheduleSave() {
  setStatus(dbMode ? "Salvando…" : "");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 600);
}
async function doSave() {
  if (!db) { setStatus("Alterações não são salvas nesta janela"); return; }
  if (saving) { pendingAgain = true; return; }
  saving = true;
  const prevAtualizado = state.meta.atualizado;
  state.meta.atualizado = new Date().toISOString().slice(0, 10);
  try {
    // Salva junto a versão do build atual (ver SEED_VERSION) -- é o que
    // permite ao init() da próxima visita saber se este salvamento já está
    // desatualizado em relação a um conteúdo publicado depois dele.
    await db.doc("content/main").set({ version: SEED_VERSION, state });
    setStatus(pendingAgain ? "Salvando…" : (dbMode === "local" ? "Salvo neste navegador" : "Salvo"));
  } catch (err) {
    state.meta.atualizado = prevAtualizado; // o salvamento falhou -- não finge que atualizou
    setStatus("Não foi possível salvar");
  } finally {
    saving = false;
    if (pendingAgain) { pendingAgain = false; scheduleSave(); }
  }
}
// Sem isto, fechar a aba (ou trocar de app no celular) logo depois de digitar
// perdia a última edição: scheduleSave() espera 600ms antes de salvar, e nada
// cancelava essa espera quando a página ia para segundo plano. pagehide cobre
// fechar/navegar para fora; visibilitychange cobre trocar de aba/app sem
// fechar (em geral o único dos dois que ainda tem tempo de completar o save).
function flushPendingSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; doSave(); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPendingSave(); });
window.addEventListener("pagehide", flushPendingSave);
async function getCap(name) {
  if (!window.claude || typeof window.claude.use !== "function") return null;
  try { return await window.claude.use(name); } catch (e) { return null; }
}
async function init() {
  let contentWasRefreshed = false;
  db = await getCap("db");
  dbMode = db ? "cloud" : null;
  if (!db) {
    try { localStorage.getItem(LOCAL_KEY); db = makeLocalDb(); dbMode = "local"; }
    catch (e) { db = null; dbMode = null; }
  }
  downloadsCap = await getCap("downloads");
  if (db) {
    try {
      let snap;
      try { snap = await db.doc("content/main").get(); }
      catch (e) { await new Promise(r => setTimeout(r, 500 + Math.random() * 400)); snap = await db.doc("content/main").get(); }
      if (snap.exists) {
        const raw = snap.data();
        // Salvamentos de antes de SEED_VERSION existir guardavam o próprio
        // estado sem embrulho -- tratados como versão desconhecida, o que
        // cai direto no "prioriza a semente nova" abaixo (certo: são
        // exatamente os navegadores que ficaram presos numa cópia antiga).
        const wrapped = raw && typeof raw === "object" && typeof raw.version === "string" && raw.state && typeof raw.state === "object";
        const savedVersion = wrapped ? raw.version : null;
        const savedState = wrapped ? raw.state : raw;
        if (savedVersion === SEED_VERSION) {
          state = Object.assign({}, cloneSeed(), savedState);
        } else {
          // O conteúdo publicado mudou desde o último salvamento feito neste
          // navegador (ou não há como saber, por ser de antes de existir essa
          // marca de versão) -- prioriza a versão nova em vez de uma cópia
          // local possivelmente desatualizada. É isto que faz uma correção de
          // conteúdo (ex.: um link consertado) chegar a quem já tinha editado
          // algo neste navegador antes, inclusive num hard refresh: sem isto,
          // o Object.assign acima substituiria cada array (blocos/normas/
          // notas/siglas) pela versão salva, por mais antiga que estivesse,
          // para sempre -- até alguém lembrar de clicar em "Restaurar".
          state = cloneSeed();
          contentWasRefreshed = true; // havia um snap.exists -- sempre houve algo pra descartar, formato antigo ou não
        }
        renderAll();
      }
    } catch (e) { /* mantém a semente */ }
  }
  updateEditControls();
  if (contentWasRefreshed) setStatus("Conteúdo atualizado nesta página — uma edição local anterior foi substituída pela versão mais recente.");
}

/* ---------- início ---------- */
renderAll();
init();
</script>
