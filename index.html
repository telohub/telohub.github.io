<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Não restringe script-src/style-src: a página é um único arquivo com
     <script>/<style> inline de propósito (sem build step, sem CDN), e isso
     exigiria nonce/hash por versão. object-src/base-uri/form-action não têm
     esse custo e já fecham uma classe real de abuso (plugins embutidos,
     sequestro de URL relativa via <base>, um <form> injetado enviando dados
     para fora) numa página que nunca precisa de nenhum dos três. -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="A cadeia produtiva do açaí no Amapá e o quadro normativo que a regula — diagrama interativo e editável.">
<title>Observatório do Açaí</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%20viewBox=&#x27;0%200%20100%20100&#x27;%3E%3Ctext%20y=&#x27;.9em&#x27;%20font-size=&#x27;90&#x27;%3E%F0%9F%AB%90%3C/text%3E%3C/svg%3E">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f6f9; --surface:#ffffff; --surface-2:#fbfbfd;
    --ink:#17171f; --ink-soft:#66667a; --ink-faint:#9a9aab;
    --border:#e6e6ee;
    --primary:#7c3aed; --primary-ink:#ffffff; --primary-soft:#f1e9fe; --primary-soft-ink:#6d28d9;
    --warn-soft:#fdf1e3; --warn-ink:#9a5b12;
    --danger:#dc4444;
    --cat-principal:#7c3aed; --cat-principal-soft:#f1e9fe;
    --cat-sup:#b45309; --cat-sup-soft:#fdf0e1;
    --cat-aux:#0d9488; --cat-aux-soft:#e1f5f2;
    --cat-apoio:#2563eb; --cat-apoio-soft:#e7eefd;
    /* slot "neutro" (grupos sem cor própria): deriva do texto/superfície, então
       acompanha sozinho o modo escuro sem precisar de variante dedicada */
    --cat-neutro:var(--ink-soft); --cat-neutro-soft:var(--surface-2);
    --shadow-sm:0 1px 2px rgba(20,20,30,.05);
    --shadow-md:0 4px 14px rgba(20,20,30,.09);
    --shadow-lg:0 12px 40px rgba(20,20,30,.16);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111116; --surface:#191921; --surface-2:#1f1f28;
      --ink:#f1f1f6; --ink-soft:#a3a3b8; --ink-faint:#6c6c80;
      --border:#2c2c38;
      --primary:#a78bfa; --primary-ink:#171723; --primary-soft:#2a2340; --primary-soft-ink:#cbb8ff;
      --warn-soft:#3a2c17; --warn-ink:#e3ad6c;
      --danger:#f37171;
      --cat-principal:#a78bfa; --cat-principal-soft:#2a2340;
      --cat-sup:#fbbf6b; --cat-sup-soft:#3a2c17;
      --cat-aux:#5eead4; --cat-aux-soft:#173330;
      --cat-apoio:#7ba8ff; --cat-apoio-soft:#1c2740;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35); --shadow-lg:0 16px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111116; --surface:#191921; --surface-2:#1f1f28;
    --ink:#f1f1f6; --ink-soft:#a3a3b8; --ink-faint:#6c6c80;
    --border:#2c2c38;
    --primary:#a78bfa; --primary-ink:#171723; --primary-soft:#2a2340; --primary-soft-ink:#cbb8ff;
    --warn-soft:#3a2c17; --warn-ink:#e3ad6c;
    --danger:#f37171;
    --cat-principal:#a78bfa; --cat-principal-soft:#2a2340;
    --cat-sup:#fbbf6b; --cat-sup-soft:#3a2c17;
    --cat-aux:#5eead4; --cat-aux-soft:#173330;
    --cat-apoio:#7ba8ff; --cat-apoio-soft:#1c2740;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35); --shadow-lg:0 16px 44px rgba(0,0,0,.5);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{height:100%;}
  body{
    height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:var(--primary);}

  /* ---------- layout ---------- */
  #app-shell{display:flex; height:100%;}
  #sidebar{
    width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:1.1rem .9rem; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:.55rem; font-weight:800; font-size:1.02rem; padding:.3rem .4rem .3rem; margin-bottom:1.3rem;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--primary); flex:0 0 auto;}
  nav.sidenav{display:flex; flex-direction:column; gap:.15rem;}
  nav.sidenav button{
    all:unset; display:flex; align-items:center; gap:.6rem; padding:.5rem .65rem; border-radius:8px;
    font-size:.88rem; font-weight:500; color:var(--ink-soft); cursor:pointer;
  }
  nav.sidenav button .ic{font-size:1rem; width:1.1rem; text-align:center;}
  nav.sidenav button:hover{background:var(--bg); color:var(--ink);}
  nav.sidenav button.active{background:var(--primary-soft); color:var(--primary-soft-ink);}
  .sidebar-bottom{margin-top:auto; padding-top:.9rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:.5rem;}
  .save-status{font-size:.76rem; color:var(--ink-faint); padding:0 .2rem; min-height:1.1em;}
  .edit-extra{display:flex; flex-direction:column; gap:.1rem;}

  #mobile-topbar{display:none;}

  #main-area{flex:1; min-width:0; overflow-y:auto; height:100%;}
  .view{display:none; padding:1.7rem 2rem 4rem; max-width:1670px;}
  .view.active{display:block;}
  .view-head{margin-bottom:1.5rem;}
  .view-head h1{font-size:1.32rem;}
  .view-head p{color:var(--ink-soft); font-size:.9rem; margin-top:.3rem; max-width:44rem;}

  /* ---------- buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
    border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:.85rem; font-weight:600; padding:.5rem .8rem; cursor:pointer;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--primary); border-color:var(--primary); color:var(--primary-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-block{width:100%;}
  .link-btn{all:unset; color:var(--ink-soft); font-size:.8rem; cursor:pointer; padding:.15rem .2rem;}
  .link-btn:hover{color:var(--primary);}

  input.search{
    font-family:inherit; font-size:.9rem; padding:.5rem .7rem; border:1px solid var(--border); border-radius:8px;
    background:var(--surface); color:var(--ink); width:100%; max-width:22rem;
  }
  input.search:focus{outline:none; border-color:var(--primary);}

  /* ---------- diagram ---------- */
  .diagram{display:flex; flex-direction:column; gap:1.9rem;}
  .lane-head{display:flex; align-items:baseline; gap:.55rem; margin-bottom:.7rem;}
  .lane-head .lic{font-size:1.05rem;}
  .lane-head h2{font-size:1rem;}
  .lane-head .lane-sub{color:var(--ink-faint); font-size:.8rem;}
  /* a cor da raia vem do slot de paleta que o grupo escolhe em modelo.json */
  .lane[data-cor="principal"]{--lc:var(--cat-principal); --lcs:var(--cat-principal-soft);}
  .lane[data-cor="sup"]{--lc:var(--cat-sup); --lcs:var(--cat-sup-soft);}
  .lane[data-cor="aux"]{--lc:var(--cat-aux); --lcs:var(--cat-aux-soft);}
  .lane[data-cor="apoio"]{--lc:var(--cat-apoio); --lcs:var(--cat-apoio-soft);}
  .lane[data-cor="neutro"]{--lc:var(--cat-neutro); --lcs:var(--cat-neutro-soft);}
  .lane-head .lic{color:var(--lc);}

  .eco-wrap{display:flex; justify-content:center; padding:.6rem 0 .4rem;}
  .eco-ring{border:1px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex:0 0 auto;}
  .eco-label{position:absolute; top:-11px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px;}
  /* controles de estrutura no diagrama (administração, modo de edição) */
  .eco-label .eco-rm, .node-card .node-rm{background:var(--surface); border:1px solid var(--border); border-radius:50%; width:1.35rem; height:1.35rem; padding:0; margin:0; opacity:1; color:var(--ink-soft); line-height:1;}
  .eco-label .eco-rm:hover, .node-card .node-rm:hover{border-color:var(--danger); color:var(--danger);}
  .eco-add{text-align:center; margin:.2rem 0 .4rem;}
  .node-card{position:relative;}
  .node-card .node-rm{position:absolute; top:-.55rem; right:-.55rem; box-shadow:var(--shadow-sm);}
  .node-add{align-self:center;}
  .eco-chip{background:var(--surface); border:1px solid var(--border); border-radius:999px; font-size:.64rem; font-weight:600; padding:.12rem .5rem; white-space:nowrap; color:var(--ink-soft); font-family:inherit; cursor:pointer;}
  .eco-chip:hover{border-color:var(--primary); color:var(--primary);}
  .eco-core{background:var(--primary); color:var(--primary-ink); border-radius:50%; width:88%; height:88%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; text-align:center; padding:.5rem;}
  .eco-note{text-align:center; font-size:.76rem; color:var(--ink-faint); margin:0 0 1.6rem;}

  .lane-track{display:flex; flex-wrap:wrap; align-items:stretch; gap:.7rem; padding:.15rem .15rem .8rem;}

  .node-card{flex:0 0 auto; width:172px;}
  .node-card button.node{
    all:unset; box-sizing:border-box; display:block; width:100%; background:var(--surface); border:1px solid var(--border);
    border-top:3px solid var(--lc); border-radius:10px; padding:.7rem .75rem; cursor:pointer;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, transform .15s ease;
  }
  .node-card button.node:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
  .node-num-row{display:flex; align-items:center; justify-content:space-between; gap:.3rem; margin-bottom:.2rem;}
  .node-num{
    background:var(--lcs); color:var(--lc); border-radius:999px; flex:0 0 auto;
    width:1.3rem; height:1.3rem; display:inline-flex; align-items:center; justify-content:center;
    font-size:.66rem; font-weight:800;
  }
  .node-next{font-size:.8rem; color:var(--ink-faint); flex:0 0 auto;}
  .node-name{font-size:.83rem; font-weight:600; line-height:1.28; margin-top:.2rem;}

  /* ---------- drawer (detalhe de elo/bloco) & backdrop ---------- */
  .modal{position:fixed; inset:0; z-index:100; background:rgba(10,10,16,.55); display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal[hidden]{display:none;}
  .modal-card{background:var(--surface); color:var(--ink); border-radius:14px; box-shadow:var(--shadow-lg); max-width:560px; width:100%; max-height:calc(100vh - 32px); overflow:auto; padding:1.5rem 1.6rem 1.3rem;}
  .modal-card h2{font-size:1.2rem; margin:0 0 .8rem;}
  .modal-card p{margin:0 0 .75rem; line-height:1.55; color:var(--ink-soft);}
  .modal-links{margin:.2rem 0 1rem; padding:0; list-style:none;}
  .modal-links li{margin:.3rem 0;}
  .modal-links a{color:var(--primary); font-weight:600;}
  .modal-acoes{display:flex; flex-wrap:wrap; gap:.6rem; justify-content:flex-end; margin-top:1rem;}
  .modal-acoes .btn{width:auto;}
  #sobre-btn{display:block; margin:0 0 .5rem;}
  #sobre-btn[hidden]{display:none;}
  #backdrop{position:fixed; inset:0; background:rgba(10,10,16,.4); opacity:0; pointer-events:none; transition:opacity .16s ease; z-index:39;}
  body.panel-open #backdrop{opacity:1; pointer-events:auto;}

  #drawer{
    position:fixed; top:0; right:0; height:100%; width:440px; max-width:94vw; background:var(--surface);
    box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .2s ease; z-index:41;
    display:flex; flex-direction:column;
  }
  body.drawer-open #drawer{transform:translateX(0);}
  .drawer-head{display:flex; align-items:flex-start; gap:.6rem; padding:1.2rem 1.2rem .9rem; border-bottom:1px solid var(--border);}
  .drawer-head .tag{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:.15rem .5rem; border-radius:999px; margin-bottom:.4rem; display:inline-block;}
  .drawer-title{font-size:1.1rem; font-weight:700; line-height:1.3;}
  .drawer-close{all:unset; margin-left:auto; cursor:pointer; color:var(--ink-faint); font-size:1.2rem; line-height:1; padding:.2rem;}
  .drawer-close:hover{color:var(--ink);}
  .drawer-body{flex:1; overflow-y:auto; padding:1.1rem 1.2rem 2rem;}
  .drawer-lede{color:var(--ink-soft); font-size:.9rem; margin-bottom:1.1rem;}
  .drawer-foot{padding:.9rem 1.2rem; border-top:1px solid var(--border);}

  .panel-section{margin-bottom:1.1rem;}
  .panel-label{display:block; font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:.4rem;}
  .callout{border-radius:8px; padding:.7rem .8rem; margin-bottom:1.1rem;}
  .callout.c-atores{background:var(--surface-2);}
  .callout.c-critico{background:var(--warn-soft);}
  .callout.c-critico .panel-label{color:var(--warn-ink);}

  ul.itemlist{list-style:none; margin:0; padding:0;}
  ul.itemlist li.row{position:relative; padding-left:1rem; margin-bottom:.32rem; font-size:.88rem;}
  ul.itemlist li.row::before{content:'–'; position:absolute; left:0; color:var(--ink-faint);}
  ul.itemlist li.row.add-row{padding-left:0;}
  ul.itemlist li.row.add-row::before{content:'';}
  .linklike{all:unset; cursor:pointer; color:var(--primary); text-align:left;}
  .linklike:hover, .linklike:focus-visible{text-decoration:underline;}

  /* ---------- legislação ---------- */
  .filters{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; margin-bottom:.6rem;}
  .pills{display:flex; flex-wrap:wrap; gap:.4rem;}
  .pill{font-family:inherit; font-size:.78rem; font-weight:600; padding:.28rem .68rem; border:1px solid var(--border); border-radius:999px; cursor:pointer; color:var(--ink-soft); background:var(--surface);}
  .pill:hover{border-color:var(--ink-faint);}
  .pill.active{border-color:var(--primary); color:var(--primary); background:var(--primary-soft);}
  .count{font-size:.8rem; color:var(--ink-faint); margin:.2rem 0 .8rem;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
  .table-wrap{overflow-x:auto;}
  table.normas{width:100%; border-collapse:collapse; font-size:.86rem;}
  table.normas th{text-align:left; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); border-bottom:1px solid var(--border); padding:.7rem .8rem; white-space:nowrap; background:var(--surface-2);}
  table.normas th:first-child{border-top-left-radius:var(--radius);}
  table.normas th:last-child{border-top-right-radius:var(--radius);}
  table.normas td{border-bottom:1px solid var(--border); padding:.65rem .8rem; vertical-align:top;}
  table.normas tr:last-child td{border-bottom:none;}
  table.normas td.col-actions{white-space:nowrap;}
  .badge{display:inline-block; font-size:.72rem; font-weight:600; padding:.1rem .5rem; border-radius:999px; background:var(--warn-soft); color:var(--warn-ink);}
  .fonte-edit{margin-top:.3rem; font-size:.76rem; color:var(--ink-faint);}
  .fonte-edit .fonte-label{text-transform:uppercase; font-size:.68rem; letter-spacing:.03em;}
  .fonte-url{word-break:break-all;}
  .conferir-toggle{font-size:.76rem; color:var(--ink-soft); display:inline-flex; align-items:center; gap:.3rem; margin-right:.5rem; white-space:nowrap;}

  /* ---------- siglas (dicionário de acrônimos) ----------
     A dica usa position:fixed, posicionada por JS (positionSiglaTip, perto dos
     outros addEventListener): a tabela, o painel lateral e a área principal
     têm overflow:auto, e position:fixed é a única forma confiável de escapar
     desse recorte em vez de a dica ficar cortada ou escondida atrás do
     conteúdo. O padding do lado do botão funciona como uma "ponte" invisível
     — sem ele, o cursor sai de cima do botão ao subir até o link e a dica
     fecha antes de chegar lá (o espaço entre os dois deixa de contar como
     "ainda em cima do botão"). A cor do cartão é fixa (não usa var(--ink)):
     --ink é o texto principal da página, então ele INVERTE no tema escuro
     (de quase-preto para quase-branco) para continuar legível sobre o fundo
     — um cartão com fundo var(--ink) ficaria então quase-branco no tema
     escuro, com o texto branco fixo da dica por cima: branco sobre branco.
     A dica é sempre um cartão escuro com texto claro, nos dois temas. */
  .sigla{display:inline; cursor:help; border-bottom:1px dotted var(--ink-faint);}
  .sigla:hover, .sigla:focus-visible{border-bottom-color:var(--primary);}
  .sigla-tip{position:fixed; z-index:9999; width:max-content; max-width:280px;
    padding-bottom:7px; opacity:0; pointer-events:none; transition:opacity .12s ease;}
  .sigla-tip.flip-below{padding-bottom:0; padding-top:7px;}
  .sigla-tip.is-open{opacity:1; pointer-events:auto;}
  .sigla-tip-card{display:block; background:#17171f; color:#fff; border-radius:8px;
    box-shadow:var(--shadow-md); padding:.55rem .7rem; font-size:.78rem; line-height:1.4; text-align:left;
    transform:translateY(4px); transition:transform .12s ease;}
  .sigla-tip.flip-below .sigla-tip-card{transform:translateY(-4px);}
  .sigla-tip.is-open .sigla-tip-card{transform:translateY(0);}
  .sigla-tip-card b{display:block; margin-bottom:.15rem;}
  .sigla-tip-card a{display:inline-block; margin-top:.3rem; color:#fff; font-weight:600; text-decoration:underline;}

  /* ---------- institucional ---------- */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:.9rem;}
  .info-card{padding:1rem 1.1rem;}
  .info-card h3{font-size:.94rem; margin-bottom:.55rem;}
  .sis-tag{display:block; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin-bottom:.3rem;}

  /* ---------- notas ---------- */
  .notas-card{padding:1.1rem 1.2rem; max-width:44rem;}

  /* ---------- edição ---------- */
  [contenteditable="true"]{outline:none; border-radius:4px; padding:0 .15rem; margin:0 -.15rem;}
  [contenteditable="true"]:hover{background:var(--primary-soft);}
  [contenteditable="true"]:focus{background:var(--primary-soft); box-shadow:0 0 0 1px var(--primary);}
  .add-item{background:none; border:1px dashed var(--border); color:var(--ink-faint); font-family:inherit; font-size:.82rem; padding:.15rem .6rem; border-radius:6px; cursor:pointer;}
  .add-item:hover{border-color:var(--primary); color:var(--primary);}
  .rm{background:none; border:none; color:var(--ink-faint); opacity:.6; cursor:pointer; font-size:.85rem; line-height:1; padding:0 .2rem; margin-left:.25rem;}
  .rm:hover{opacity:1; color:var(--danger);}
  body:not(.editing) .rm, body:not(.editing) .add-item{display:none;}
  body.editing .node-card button.node{box-shadow:0 0 0 1px var(--lc) inset;}
  /* painel "Estrutura do documento" */
  .est-sec{margin-bottom:1.5rem;}
  .est-item{border-top:1px solid var(--border); padding-top:.7rem;}
  .est-bar{display:flex; align-items:center; gap:.15rem; margin-bottom:.4rem;}
  .est-bar .sis-tag{flex:1; margin:0;}
  .rm:disabled{opacity:.2; cursor:default;}
  .est-ctrl{display:block; font-size:.82rem; color:var(--ink-soft); margin:.25rem 0 .55rem;}
  .est-ctrl select{font:inherit;}
  .est-ctrl input[type="text"]{font:inherit; width:100%; margin-top:.2rem;}
  .est-sec [contenteditable="true"]:empty{display:inline-block; min-width:4rem; min-height:1em;}

  /* ---------- responsivo ---------- */
  @media (max-width:860px){
    #sidebar{
      position:fixed; top:0; left:0; height:100%; width:264px; z-index:40; border-right:1px solid var(--border);
      transform:translateX(-100%); transition:transform .18s ease; padding-top:calc(1.1rem + env(safe-area-inset-top,0px));
    }
    body.nav-open #sidebar{transform:translateX(0);}
    #mobile-topbar{
      display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem; padding-top:calc(.7rem + env(safe-area-inset-top,0px));
      background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
    }
    #mobile-topbar .hamburger{all:unset; cursor:pointer; font-size:1.15rem; padding:.2rem .3rem; color:var(--ink);}
    #mobile-topbar .mt-title{font-weight:700; font-size:.95rem;}
    #app-shell{display:block; height:auto; min-height:100%;}
    #main-area{height:auto; overflow-y:visible;}
    .view{padding:1.3rem 1rem 5rem;}
    #drawer{width:100%; max-width:100%;}
  }
  @media (max-width:520px){
    body{font-size:14px;}
    .view-head h1{font-size:1.16rem;}
  }
</style>

rtificado, em 2016.", "elos": ["e1"], "status": "ok", "fonte": ""}, {"esfera": "Federal", "titulo": "Lei 7.678/1988", "resumo": "Reserva o nome “vinho” à bebida de uva (art. 3º, parágrafo único) — base do debate sobre chamar produtos de açaí de “vinho”. Confirmado: o Decreto 12.709/2025 (31/10/2025) regulamenta expressamente esta lei junto com as Leis 8.171/1991, 8.918/1994, 9.972/2000 e 14.515/2022, com uma subseção própria sobre \"vinho e derivados da uva e do vinho\" (arts. 92-94). Como a Lei 8.918/1994 também era a base do Decreto 6.871/2009, é provável que o 12.709/2025 o tenha substituído — não encontrei o artigo de revogação para confirmar (ver nota em Decreto 6.871/2009). A Lei 13.648/2018 (base do Decreto 10.026/2019) não está na lista de normas regulamentadas pelo 12.709/2025, então o 10.026/2019 não parece afetado.", "elos": ["e6", "auxiliar"], "status": "conferir", "fonte": "https://legis.senado.leg.br/norma/549554/publicacao/15751958"}, {"esfera": "Técnicas", "titulo": "Embrapa Amapá: Açaí Seguro", "resumo": "Material técnico de BPF e choque térmico para batedeiras.", "elos": ["e5", "e6"], "status": "ok", "fonte": ""}], "notas": ["Resolvido (2026-10-11): as Leis 3.426/2026 e 3.428/2026 (AP) só têm cláusula de revogação genérica (\"disposições em contrário\"), sem citar a Lei 0869/2004 — não há revogação expressa. Na prática, a parte vegetal da lei de 2004 cede às leis novas onde o conteúdo coincide; a parte animal fica intocada.", "Resolvido (2026-10-11): o Decreto 6.871/2009 está CONFIRMADO revogado pelo Decreto 12.709/2025 (aviso explícito na página do Planalto). Criada entrada própria para o Decreto 12.709/2025. O Decreto 10.026/2019 não foi revogado por ele, mas tem revogação parcial própria e não relacionada (Decreto 12.502/2025, ver nota abaixo).", "Prioridade: o Decreto 10.026/2019 teve os Arts. 32, 33, 43 e 44 revogados pelo Decreto 12.502/2025 — ainda não verifiquei se essas partes tratam de polpa de fruta/Sipeagro ou de outra categoria de agroindústria rural do mesmo decreto.", "A conferir: na RDC 275/2002 (Anvisa), a ementa, os Arts. 1º-7º e o Anexo I aparecem riscados na fonte oficial (bvsms) — sinal típico de revogação — mas não achei qual norma posterior fez isso. Buscar diretamente no site atual da Anvisa (não só o espelho bvsms/antigo.anvisa).", "IN SDA 37/2018 (parâmetros de suco/polpa, inclui o teor mínimo de 8% do açaí): a Portaria SDA/MAPA 1173/2024 propõe alterar os itens 44 e 64 do Anexo I, mas ainda está em consulta pública (não é alteração definitiva) e não confirmei se esses itens são do açaí ou de outra fruta da tabela. Monitorar.", "IN MAPA 72/2018 (registro Sipeagro): há uma minuta de alteração em consulta pública no site do MAPA (\"registroestabelecimentos\"); ainda não é alteração definitiva. IN MAPA 49/2018: nenhum sinal de revogação encontrado numa busca rápida, mas não fiz o fetch direto da fonte oficial ainda.", "Monitorar: a RDC 727/2022 (rotulagem geral) está em Consulta Pública nº 1.400/2026 para alterar declaração quantitativa de ingredientes, tecnologia de transmissão da informação do rótulo e rotulagem de alimentos irradiados — consulta aberta de 17/7 a 15/10/2026, ainda sem texto final.", "Monitorar: a RDC 243/2018 (suplementos alimentares) está em processo de alteração desde a Consulta Pública nº 1.325/2025 (17/4/2025); a Anvisa fez um diálogo setorial sobre o resultado em 2026, mas não confirmei se já virou resolução definitiva (página da notícia fora do ar no momento da checagem).", "RDC 722/2022 e IN 160/2022 (limites de contaminantes): nenhuma revogação confirmada; há alguma atividade da diretoria colegiada da Anvisa em 2025 (votos de reunião) que pode indicar revisão em curso, não aprofundei.", "Padrão identificado (2026-10-14): a Lei 14.515/2022 revoga pontualmente artigos de SANÇÕES/penalidades em várias leis agrícolas do MAPA ao mesmo tempo (já confirmado em Lei 8.918/1994 art. 9º, Lei 10.711/2003 arts. 42 e 43 I-VI, Lei 10.831/2003 art. 6º) — parece ser uma consolidação geral do regime de penalidades, não revogações de mérito. Ao checar outras leis do MAPA/Vigilância Agropecuária, vale checar direto se algum artigo de sanção foi pego por ela, em vez de tratar cada uma como surpresa isolada.", "Lei 11.947/2009 (PNAE): o Art. 14 (percentual mínimo de compra da agricultura familiar) mudou nos últimos anos — o texto consolidado mostra 30% numa versão e 45% noutra (leis de 2023-2025: 14.660, 14.734, 15.178, 15.226, 15.255, 15.276). Confirmar qual percentual vigora hoje.", "Amazonas: não localizei lei ou decreto estadual específico sobre açaí; detalhar ADAF, IDAM e VISA-AM.", "Amapá: não localizei a portaria que regulamenta a Lei 1.914/2015 (equipamentos e requisitos).", "Macapá: número do Código Sanitário ainda não confirmado (a LC 144/2021 é o Código Tributário, não o sanitário — hipótese descartada); mais duas buscas (2026-10-11) não acharam o número — tentar o portal do Diário Oficial do Município diretamente, não só agregadores. Localizar também o ato da autorização ambiental para batedeiras.", "Pará: o PL 169/2024 foi aprovado pelo plenário da Alepa em 8/4/2025 (confirmado); sanção e número de lei definitivo ainda não localizados — é um processo distinto do PL 344/2025, que virou a Lei 11.140/2025.", "NR-35: verificar a aplicabilidade à escalada com peconha.", "Ainda sem fonte com link: Portaria MAPA 52/2021, Portaria SPA/MAPA 5/2024, Lei 11.326/2006, Lei 15.190/2025, Lei 12.305/2010, CONAMA 430/2011, as NRs, Lei 9.933/1999, IG do Bailique, Lei 15.330/2026, boa parte de PA/AM/municípios/outros estados e as normas técnicas (ABNT, Codex, FSC, Embrapa) — nesta rodada priorizei o bloco federal (Anvisa/MAPA) e o Amapá.", "Ainda não cobertos: tributário (ICMS, IBS/CBS), exportação (MAPA, SECEX e exigências do destino), navegação (autoridade marítima) e regime de uso das várzeas (SPU).", "Elo 10 (consumo final): detalhar utensílios, equipamentos e pontos críticos.", "Siglas (2026-10-15): criado src/siglas.json — dicionário de acrônimos com dica (expansão + link institucional) ao passar o mouse, em todo o site. 97 cadastradas, 38 ainda como 'conferir' (quase sempre o link, não a expansão). Faltam pesquisar e cadastrar: Sipeagro/SIPEAGRO (nome oficial do sistema — aparece em IN MAPA 72/2018 e Decreto 10.026/2019), ACTB (associação do Bailique, titular da IG), DAPP/RAP/RAPC (atos da IN SEMA 1/2024), SVS-GEA (de propósito não cadastrada junto do SVS/MS da Portaria 326/1997 — são siglas distintas e cadastrar as duas como 'SVS' colidiria), SEDCON (Belém) e SLIM (Decreto 4.648/2019, Manaus).", "Links corrigidos (2026-10-17, apontados pelo usuário): SEMA/SEMA-AP e DIAGRO/DIAGRO-AP migraram para o novo domínio *.portal.ap.gov.br (sema.portal.ap.gov.br/coema, diagro.portal.ap.gov.br); RESEX, NR e ZARC tiveram a url em siglas.json trocada para a página que substituiu a antiga. Em normas.json, a Portaria SVS/MS 326/1997, a IN MAPA 49/2018, a RDC 727/2022 e os três pares com dois instrumentos no mesmo título (RDC 724/2022 e IN 161/2022; RDC 722/2022 e IN 160/2022; RDC 429/2020 e IN 75/2020) tiveram a fonte trocada de antigo.anvisa.gov.br (fora do ar) para anvisalegis.datalegis.net ou gov.br/agricultura. Nos três pares, o usuário deu um link por instrumento; mantive a fonte apontando para o mesmo lado que já estava antes da correção (IN 161, IN 160, RDC 429) para não mudar qual dos dois instrumentos o link representa — os links do outro lado (RDC 722/2022 e IN 75/2020, avulsos) ficaram sem uso.", "PENDENTE (2026-10-17): o link dado pelo usuário para 'IN SEMA 1/2024' é do SEMA do Maranhão (sema.ma.gov.br, assunto 'fiscalização'). A entrada existente com esse título em normas.json é do SEMA do Amapá (esfera Amapá; cria DAPP/RAP/RAPC para manejo de açaí em várzea) — mesmo número e sigla, instrumento diferente, por coincidência. A fonte dessa entrada NÃO foi alterada (continua https://www.legisweb.com.br/legislacao/?id=460282) até confirmar com o usuário qual é o link certo para a versão Amapá.", "Dica de sigla em touch (2026-10-19): toque agora abre/fecha a dica (ver README, seção 'Siglas e abreviações'). Pegadinha real encontrada e corrigida durante o teste: tocar o <span tabindex=\"0\"> move o foco pra ele ANTES do click (mousedown dispara focusout de quem tinha foco e focusin na própria sigla), e o focusin sempre abre a dica (pra funcionar por teclado) — um primeiro design que decidia abrir/fechar pelo estado ATUAL no momento do click fecharia o que o focusin do mesmo toque tinha acabado de abrir, parecendo que nada acontecia ao tocar. Corrigido tirando uma 'foto' do estado (touchSiglaWasOpen) no touchstart, antes de qualquer efeito colateral do próprio toque, e decidindo por ela no click. Também descoberto ao testar: os métodos de conveniência do Playwright (locator.tap()/.scroll_into_view_if_needed()) posicionam um mouse de verdade antes do gesto e disparam um mouseover genuíno ANTES do touchstart — não acontece num toque real (não existe mouse num celular) e mascarava/causava falsos negativos; os testes usam scrollIntoView nativo + page.touchscreen.tap para simular um toque real com fidelidade.", "Conteúdo desatualizado por cópia local (2026-10-22, relatado pelo usuário): confirmado e corrigido um bug real -- qualquer edição salva no navegador (mesmo uma acidental, só testando 'Editar') passava a vencer a semente embutida pra sempre, inclusive num hard refresh, até alguém clicar em 'Restaurar conteúdo original'. Causa: init() fazia state = Object.assign({}, cloneSeed(), snap.data()), um merge RASO -- cada array (blocos/normas/notas/siglas) salvo localmente substituía o array inteiro da semente nova, não só os campos realmente editados. Um link corrigido em normas.json, por exemplo, nunca chegava a quem já tivesse qualquer coisa salva localmente. Corrigido com um hash do conteúdo calculado em build.py (SEED_VERSION, baseado no conteúdo -- não timestamp, então rebuildar sem mudar normas/blocos/notas/siglas não invalida à toa o que estiver salvo) gravado junto do estado a cada salvamento; no carregamento, só reaproveita o que está salvo se a versão bater com a deste build, senão descarta em favor do conteúdo publicado (com aviso na barra de status) -- isso também corrige automaticamente, na primeira visita após este build, os navegadores que já estavam presos numa cópia antiga de antes desta correção existir (salvamentos desse tipo não têm nenhum campo de versão, então contam como desatualizados por definição). Ver README, seção 'Segurança e robustez'.", "Modelo da cadeia (2026-11-04): os elos 1-4 (produção primária, colheita/debulha/acondicionamento, transporte primário e portos, comercialização do fruto) passaram da Cadeia principal para a Cadeia de suprimentos — tudo que vem antes da transformação do fruto é suprimento; a Cadeia principal agora é a cadeia de processamento (elos 5-10, do beneficiamento ao consumo final). Só o campo 'grupo' mudou: os ids e1-e4 continuam os mesmos, então as normas marcadas com esses elos (e1: 25, e2: 11, e3: 12, e4: 11) seguem válidas sem alteração. Pegadinha corrigida junto: o botão 'Ver legislação' do painel de detalhe decidia entre 'deste elo' e 'aplicável' pelo GRUPO do bloco; sem ajuste, e1-e4 passariam a filtrar por 'apoio' (12 normas, nenhuma delas as de e1-e4). Agora a decisão é pelo id do bloco (e1..e10). Na raia de suprimentos, e1-e4 aparecem como cartões soltos, sem numeração.", "Modelo como dados (2026-11-09): quais grupos/raias, sistemas de contexto e etiquetas de elo existem deixou de ser código (GRUPO_IDS/SISTEMA_IDS/ELO_IDS no build.py, SISTEMAS/lanes/ELO_TAG_POR_GRUPO no template) e passou para src/modelo.json, que viaja no estado, no export e no import; o build valida o modelo e as referências contra ele, e o navegador faz a mesma checagem ao importar. Um documento de outro domínio agora sai trocando só arquivos de dados (teste automatizado). Três mudanças de comportamento a conhecer: (1) o botão 'Ver legislação aplicável' estava com o mapeamento trocado — Circular abria o filtro 'auxiliar' e Auxiliar/Suprimentos abriam 'apoio'; agora Auxiliar → 'auxiliar' (as 16 normas passam a abrir pelos blocos p1, p5, p6) e Circular/Suprimentos → 'apoio' (as 12 normas); (2) o campo 'elos' da tabela de normas reconhece só id, abreviação ou apelido do modelo — 'auxiliares' (prefixo) e 'e11' (elo inexistente) deixam de ser aceitos; (3) como a semente ganhou o modelo, o hash SEED_VERSION mudou: quem tinha edição local salva a vê substituída uma única vez, com o aviso de sempre. Importar um arquivo com bloco/norma apontando para grupo, sistema ou elo inexistente agora é recusado; exports antigos (sem modelo) continuam entrando.", "Identidade e vistas como dados (2026-11-10): o 'casco' do documento deixou de ser código. Título, marca, ícone do favicon, descrição e a chave de armazenamento (slug) vêm de src/meta.json; o menu, as seções, os títulos/introduções e o vocabulário da vista de normas (cabeçalhos, busca, contagem, selo 'a conferir', ordem das esferas, botões 'Ver legislação…') vêm de modelo.vistas, com quatro tipos de vista (diagrama, normas, cartoes, lista). A vista Institucional passou a ser 'cartões do grupo X' (não mais amarrada ao id 'institucional'); meta.intro virou a introdução da vista Cadeia; meta.margem continua sem uso. Efeitos a conhecer: (1) SEED_VERSION mudou de novo — quem tinha edição local salva a vê substituída uma única vez, com o aviso de sempre (segunda vez em poucos dias); (2) a chave de armazenamento e o nome do arquivo exportado continuam iguais (observatorio-acai); (3) a mensagem de importação recusada agora diz 'exportado por \"<título>\"' em vez de 'pelo Observatório do Açaí'; (4) exports da Fase 2 continuam entrando, completados com as vistas do build. Endurecimento junto: o build agora responde com mensagem (não traceback) a valores não-textuais em ids/tipos, e o regex de ids de vista/slug usa fullmatch (o $ do Python aceitaria 'abc\\n'). Os scripts de teste vivem fora do repositório; um domínio-teste (café) com identidade, vistas e vocabulário próprios, sem vista de notas e com duas vistas de cartões, é gerado só com arquivos de dados."], "siglas": {"MAPA": {"expansao": "Ministério da Agricultura, Pecuária e Abastecimento", "url": "https://www.gov.br/agricultura/pt-br", "status": "ok"}, "Anvisa": {"expansao": "Agência Nacional de Vigilância Sanitária", "url": "https://www.gov.br/anvisa/pt-br", "status": "ok"}, "IBAMA": {"expansao": "Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis", "url": "https://www.gov.br/ibama/pt-br", "status": "ok"}, "ICMBio": {"expansao": "Instituto Chico Mendes de Conservação da Biodiversidade", "url": "https://www.gov.br/icmbio/pt-br", "status": "ok"}, "INCRA": {"expansao": "Instituto Nacional de Colonização e Reforma Agrária", "url": "https://www.gov.br/incra/pt-br", "status": "ok"}, "SPU": {"expansao": "Secretaria de Patrimônio da União — gestão dos imóveis e áreas da União, como as várzeas onde o açaí nativo é manejado", "url": "https://www.gov.br/economia/pt-br", "status": "conferir"}, "INMETRO": {"expansao": "Instituto Nacional de Metrologia, Qualidade e Tecnologia", "url": "https://www.gov.br/inmetro/pt-br", "status": "ok"}, "INPI": {"expansao": "Instituto Nacional da Propriedade Industrial", "url": "https://www.gov.br/inpi/pt-br", "status": "ok"}, "MTE": {"expansao": "Ministério do Trabalho e Emprego", "url": "https://www.gov.br/trabalho-e-emprego/pt-br", "status": "ok"}, "BNDES": {"expansao": "Banco Nacional de Desenvolvimento Econômico e Social", "url": "https://www.bndes.gov.br", "status": "ok"}, "STF": {"expansao": "Supremo Tribunal Federal", "url": "https://portal.stf.jus.br", "status": "ok"}, "SECEX": {"expansao": "Secretaria de Comércio Exterior", "url": "https://www.gov.br/mdic/pt-br", "status": "conferir"}, "PNAE": {"expansao": "Programa Nacional de Alimentação Escolar", "url": "https://www.gov.br/fnde/pt-br/acesso-a-informacao/acoes-e-programas/programas/pnae", "status": "conferir"}, "PAA": {"expansao": "Programa function getPath(obj, path) {
  if (!path) return obj;
  return path.split(".").reduce((cur, seg) => {
    if (cur == null) return undefined;
    return cur[/^\d+$/.test(seg) ? Number(seg) : seg];
  }, obj);
}
function setPath(obj, path, value) {

  const last = parts.pop();
  const parent = getPath(obj, parts.join("."));
  parent[/^\d+$/.test(last) ? Number(last) : last] = value;
}

  const parts = path.split(".");
  const last = parts.pop();
  const parent = getPath(obj, parts.join("."));
  parent.splice(Number(last), 1);
}

   e se digita na tabela) e, opcionalmente, apelidos aceitos na digitação. O
   reconhecimento é EXATO (id, abreviação ou apelido, sem diferenciar

    if (tok === "todos" || tok === "t") { elos.forEach(e => out.push(e.id)); return; }
    const hit = elos.find(e => e.id.toLowerCase() === tok || e.abrev.toLowerCase() === tok ||

function el(tag, attrs, children) {
  const e = document.createElement(tag);

    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  if (children != null) {
    if (Array.isArray(children)) children.forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    else if (typeof children === "string") e.textContent = children;
    else e.appendChild(children);

  return e;

  esfera: "Esfera", titulo: "Título", resumo: "Resumo", fonte: "Fonte (link da norma)",
  elos: "Elos (ids separados por vírgula)", nome: "Nome", itens: "Item",

  // dado do documento); o sufixo explicativo de "elos" é texto do editor.

  if (op === "rm") {
    const uso = usoDoItem(lista, arr[i]);
    if (uso) { setStatus(`Não foi possível remover ${sec.item} "${arr[i].id}": ${uso}.`); return; }
    ok = tentarEstado(c => removeAtPath(c, `${lista}.${i}`));
  } else if (op === "add") {
    const novoIndice = arr.length;
    ok = tentarEstado(c => getPath(c, lista).push(sec.novo(c.modelo)));
    foco = `[data-path="${lista}.${novoIndice}.${sec.campos[0][0]}"]`;
  } else {
    const j = op === "up" ? i - 1 : i + 1;
    ok = tentarEstado(c => { const a = getPath(c, lista); [a[i], a[j]] = [a[j], a[i]]; });
    // o botão que acabou de ser usado fica desabilitado numa ponta: o foco vai para o oposto

/* ---------- casca do documento: identidade + vistas ----------

/* só a vista ativa é construída no DOM; as outras ficam com os contêineres

  const atual = vistaDef(currentView);
  VIEW_RENDERERS[atual.tipo](atual);
  fillIntro(atual); // siglas podem ter mudado (importar/restaurar) sem a casca mudar
  state.modelo.vistas.forEach(v => {
    if (v.id === atual.id) return;
    containersOf(v).forEach(id => { const n = document.getElementById(id); if (n) n.replaceChildren(); });
  });

function rerenderForPath(path) {
  const atual = vistaDef(currentView);
  if (path.startsWith("normas")) { if (atual && atual.tipo === "normas") renderNormas(atual); return; }
  if (path.startsWith("notas")) { if (atual && atual.tipo === "lista" && atual.fonte === "notas") renderLista(atual); return; }
  if (path.startsWith("blocos.")) {
    const idx = Number(path.split(".")[1]);
    const grp = state.blocos[idx] && state.blocos[idx].grupo;

/* ---------- edição: eventos ---------- */
// Portão de toda edição ESTRUTURAL (identidade, modelo, vistas): a mudança é
// aplicada num clone do estado e só vira o estado se validShape() — as mesmas
// regras de um arquivo importado — aceitar o resultado. Recusada, nada muda.
function tentarEstado(mutar) {
  const cand = JSON.parse(JSON.stringify(state));
  mutar(cand);
  if (!validShape(cand)) return false;
  state = cand;
  scheduleSave();
  renderAll();
  return true;
}
function commitField(t) {
  const path = t.getAttribute("data-path");
  if (!path) return;
  const raw = t.textContent.replace(/\s+/g, " ").trim();
  if (/^(meta|modelo)\./.test(path)) {
    if (raw === getPath(state, path)) return; // nada mudou: não reconstrói a casca à toa
    if (!tentarEstado(c => setPath(c, path, raw))) {
      t.textContent = getPath(state, path); // restaura o texto anterior
      setStatus("Alteração recusada: o resultado não seria um documento válido (ex.: texto vazio).");
    }
    return;
  }
  if (t.getAttribute("data-parse") === "elos") {
    const arr = parseElosText(raw);
    setPath(state, path, arr);
    t.textContent = formatElosShort(arr);
  } else {
    setPath(state, path, raw);
  }
  scheduleSave();
  if (path.match(/^blocos\.\d+\.nome$/)) updateNodeCardLabel(Number(path.split(".")[1]));
  // esfera alimenta os pills de filtro e elos decide quais linhas um filtro de
  // elo mostra — sem isto, editar um dos dois deixava os pills/filtros com
  // contagens ou resultados desatualizados até outra ação forçar um re-render.
  if (path.match(/^normas\.\d+\.(esfera|elos)$/)) renderNormas();

function focusLater(sel) { requestAnimationFrame(() => { const e = document.querySelector(sel); if (e) e.focus(); }); }

/* ---------- siglas: abrir/fechar e posicionar a dica ----------

   delegação; e Node.contains() (não CSS :hover) porque a dica é fixed e fica
   visualmente separada do botão — :hover deixaria de "ver" o botão assim que
   o cursor saísse da caixinha dele, mesmo a dica sendo filha dele no DOM.

   do click, um mouseover/mousemove "fantasma" (compatibilidade do navegador
   com sites que só conhecem mouse) -- touchActive marca que a interação atual
   começou por um toque, e o handler de mouseover ignora esse fantasma enquanto

   segurança do fantasma), liberando o hover normal pro próximo uso com mouse.

   antes de qualquer outro efeito do mesmo toque -- importante porque tocar um
   <span tabindex="0"> move o foco pra ele ANTES do click (mousedown dispara
   focusout de quem tinha foco e focusin na sigla), e o focusin sempre abre a
   dica (pra funcionar também por teclado); sem essa foto prévia, o click do

document.addEventListener("touchend", () => { touchActiveTimer = setTimeout(() => { touchActive = false; }, 500); }, { passive: true });
let openSiglaBtn = null;
function positionSiglaTip(btn) {

  const margin = 8;
  const th = tip.offsetHeight, tw = tip.offsetWidth;
  const flip = r.top - th < margin;
  tip.classList.toggle("flip-below", flip);

      if (!isObj(v.colunas) || !COLUNAS_NORMAS.every(k => isTxt(v.colunas[k]))) return false;
      if (!Array.isArray(v.ordemEsferas) || !v.ordemEsferas.every(isTxt)) return false;
      if (!isObj(v.rotulos) || !ROTULOS_NORMAS.every(k => isTxt(v.rotulos[k]))) return false;
      if (!v.rotulos.contagem.includes("{total}") || !v.rotulos.contagem.includes("{visiveis}")) return false;
      normas++;
    } else if (v.tipo === "cartoes") {
      if (typeof v.grupo !== "string" || !grupoIds.has(v.grupo)) return false;
    } else if (!FONTES_LISTA.includes(v.fonte)) return false;
  }
  return diagramas <= 1 && normas <= 1;
}
// Compatibilidade com exports de antes da Fase 3: um modelo sem `vistas` (ou sem
// `ecossistema.dicaChip`) é completado com o do build — campo a campo, nunca por
// Object.assign/spread de um objeto vindo do arquivo (uma chave literal
// "__proto__" trocaria o protótipo). Se o resultado não passar em validModelo
// (ex.: as vistas do build apontam para um grupo que o modelo importado não tem),
// o arquivo é rejeitado: não há como adivinhar vistas para um modelo desconhecido.
function completeModelo(m) {
  if (!m || typeof m !== "object" || Array.isArray(m)) return m;
  const eco = m.ecossistema;
  const sd = JSON.parse(JSON.stringify(SEED.modelo)); // cópia: o estado nunca compartilha objetos com SEED
  return {
    grupos: m.grupos, sistemas: m.sistemas, elos: m.elos,
    ecossistema: (eco && typeof eco === "object" && !Array.isArray(eco))
      ? { nucleo: eco.nucleo, nota: eco.nota, semItem: eco.semItem, dicaChip: eco.dicaChip !== undefined ? eco.dicaChip : sd.ecossistema.dicaChip }
      : eco,
    vistas: m.vistas !== undefined ? m.vistas : sd.vistas,
  };
}
// O modelo que um arquivo importado passaria a ter (ou o do build, se não traz um).
function importedModelo(obj) {
  return obj.modelo !== undefined ? completeModelo(obj.modelo) : JSON.parse(JSON.stringify(SEED.modelo));
}
// Identidade do documento. `slug` é sempre o da semente (ver LOCAL_KEY); título,
// ícone e subtítulo vêm do arquivo quando são textos não vazios (export de antes
// da Fase 3 não os tem: ficam os do build). Campo a campo; chaves desconhecidas
// (ex.: o antigo meta.intro, que passou a ser a introdução da vista Cadeia) saem.
function completeMeta(m) {
  const sm = SEED.meta;
  const out = { slug: sm.slug };
  for (const k of ["titulo", "icone", "subtitulo"]) out[k] = (typeof m[k] === "string" && m[k].trim() !== "") ? m[k] : sm[k];
  out.margem = (Array.isArray(m.margem) && m.margem.every(s => typeof s === "string")) ? m.margem : (sm.margem || []).slice();
  out.atualizado = typeof m.atualizado === "string" ? m.atualizado : sm.atualizado;
  // apresentação: a do arquivo, montada campo a campo (validShape já conferiu a forma); sem ela, a do build, se houver
  const a = m.apresentacao !== undefined ? m.apresentacao : sm.apresentacao;
  if (a) out.apresentacao = { titulo: a.titulo, paragrafos: a.paragrafos.slice(),
    links: (a.links || []).map(l => ({ rotulo: l.rotulo, url: l.url })), botao: a.botao };
  return out;
}
// Mesmas regras de validate_apresentacao() do build.py.
function validApresentacao(a) {
  const isTxt = v => typeof v === "string" && v.trim() !== "";
  if (!a || typeof a !== "object" || Array.isArray(a) || !isTxt(a.titulo) || !isTxt(a.botao)) return false;
  if (!Array.isArray(a.paragrafos) || !a.paragrafos.length || !a.paragrafos.every(isTxt)) return false;
  const links = a.links === undefined ? [] : a.links;
  return Array.isArray(links) && links.every(l => l && typeof l === "object" && isTxt(l.rotulo) && typeof l.url === "string" && /^https?:\/\//.test(l.url));
}
// Confere não só a presença de meta/blocos/normas/notas (forma de alto nível),
// mas o tipo de cada campo que o render de fato lê — um JSON importado é
// conteúdo de fora, então um item malformado (ex.: um bloco nulo, ou uma
// norma sem elos) precisa ser rejeitado aqui, antes de entrar em `state`,
// em vez de quebrar no meio do render com `state` já mutado.
function validShape(obj) {
  if (!obj || typeof obj !== "object") return false;
  if (!obj.meta || typeof obj.meta !== "object" || Array.isArray(obj.meta)) return false;
  // identidade: se o arquivo traz título/ícone/subtítulo, têm que ser textos não
  // vazios (ausentes, valem os do build — ver completeMeta); o slug do arquivo é ignorado
  for (const k of ["titulo", "icone", "subtitulo"]) {
    const v = obj.meta[k];
    if (v !== undefined && !(typeof v === "string" && v.trim() !== "")) return false;
  }
  if (obj.meta.apresentacao !== undefined && !validApresentacao(obj.meta.apresentacao)) return false;
  if (!Array.isArray(obj.blocos) || !Array.isArray(obj.normas) || !Array.isArray(obj.notas)) return false;
  const isStr = v => typeof v === "string";
  for (const b of obj.blocos) {
    if (!b || typeof b !== "object" || !isStr(b.id) || !isStr(b.grupo) || !isStr(b.nome)) return false;
    if (b.secoes !== undefined) {
      if (!Array.isArray(b.secoes)) return false;
      for (const s of b.secoes) {
        if (!s || typeof s !== "object" || !isStr(s.titulo) || !Array.isArray(s.itens)) return false;
      }
    }
    if (b.sistemas !== undefined && !Array.isArray(b.sistemas)) return false;
  }
  for (const n of obj.normas) {
    if (!n || typeof n !== "object" || !isStr(n.esfera) || !isStr(n.titulo) || !Array.isArray(n.elos)) return false;
    if (n.fonte !== undefined && !isStr(n.fonte)) return false;
    if (n.status !== undefined && n.status !== "ok" && n.status !== "conferir") return false;
  }
  for (const nota of obj.notas) { if (!isStr(nota)) return false; }
  if (obj.siglas !== undefined) {
    if (!obj.siglas || typeof obj.siglas !== "object" || Array.isArray(obj.siglas)) return false;
    for (const key of Object.keys(obj.siglas)) {
      const info = obj.siglas[key];
      if (!info || typeof info !== "object" || !isStr(info.expansao) || !info.expansao.trim()) return false;
      if (info.url !== undefined && !isStr(info.url)) return false;
    }
  }
  // O modelo: se o arquivo traz um, ele (completado, se for de antes das vistas)
  // tem que ser válido; se não traz (export de antes do modelo existir), vale o
  // do build. Em qualquer caso, blocos e normas só podem apontar para grupos,
  // sistemas e elos que esse modelo define (o build.py faz a mesma checagem nos
  // arquivos de dados).
  const modelo = importedModelo(obj);
  if (!validModelo(modelo)) return false;
  const grupoIds = new Set(modelo.grupos.map(g => g.id));
  const sistemaIds = new Set(modelo.sistemas.map(s => s.id));
  const eloIds = new Set(modelo.elos.map(e => e.id));
  for (const b of obj.blocos) {
    if (!grupoIds.has(b.grupo)) return false;
    if (b.sistemas !== undefined && !b.sistemas.every(sid => isStr(sid) && sistemaIds.has(sid))) return false;
  }
  for (const n of obj.normas) {
    if (!n.elos.every(eid => isStr(eid) && eloIds.has(eid))) return false;
  }
  return true;
}
// Lê um JSON exportado e devolve { parsed, estado } — o estado que ele
// representa — ou alerta e devolve null. Usada por Importar e por Comparar proposta.
async function lerEstadoDeArquivo(file) {
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch (err) { alert("Não foi possível ler este arquivo. Confira se é um JSON exportado por \"" + SEED.meta.titulo + "\"."); return null; }
  if (!validShape(parsed)) { alert("Este arquivo não tem o formato esperado, ou algum item dentro dele (bloco, norma, sigla...) está incompleto."); return null; }
  // Monta o estado campo a campo (nunca Object.assign({}, seed, parsed), que
  // copiaria QUALQUER chave de nível superior do arquivo importado, inclusive uma
  // chave literal "__proto__" — um arquivo JSON malicioso poderia usar isso para
  // trocar o protótipo do objeto resultante). Aqui só os 6 campos esperados são
  // lidos do arquivo; o resto do conteúdo importado é ignorado.
  const estado = {
    meta: completeMeta(parsed.meta), blocos: parsed.blocos, normas: parsed.normas, notas: parsed.notas,
    siglas: (parsed.siglas && typeof parsed.siglas === "object") ? parsed.siglas : cloneSeed().siglas,
    // completado como em validShape (export de antes das vistas, ou do modelo)
    modelo: importedModelo(parsed),
  };
  return { parsed, estado };
}
async function handleImportFile(file) {
  if (!file) return;
  const lido = await lerEstadoDeArquivo(file);
  if (!lido) return;
  const { parsed } = lido;
  const seed = cloneSeed();
  const atualizado = (parsed.meta && typeof parsed.meta.atualizado === "string") ? `Atualizado em: ${parsed.meta.atualizado}\n` : "";
  const resumo = `${atualizado}Blocos: ${parsed.blocos.length} · Normas: ${parsed.normas.length} · Notas: ${parsed.notas.length}`;
  if (!confirm(`Importar este arquivo vai substituir todo o conteúdo atual por ele.\n\n${resumo}\n\nContinuar?`)) return;
  undoSnapshot = JSON.stringify(state);
  state = lido.estado;
  SIGLA_RE = null; // o conjunto de siglas pode ter mudado — invalida o cache (ver siglaRegex)
  closeDrawer();
  try {
    renderAll();
  } catch (err) {
    // Passou pelo validShape mas ainda assim quebrou ao desenhar a tela (um
    // caso que a validação não previu). Em vez de deixar a página num estado
    // quebrado e arriscar persistir isso no próximo salvamento automático,
    // volta para a seed original agora mesmo — e, como isso acontece antes do
    // scheduleSave() abaixo, nada do conteúdo quebrado chega a ser salvo.
    state = seed;
    SIGLA_RE = null;
    renderAll();
    updateEditControls();
    alert("O arquivo importado causou um erro ao exibir o conteúdo. A importação foi desfeita e o conteúdo original foi restaurado.");
    return;
  }
  updateEditControls();
  scheduleSave();
}

/* ---------- propostas (só no build de administração) ----------
   Um arquivo exportado pelo build público é uma proposta. diffEstado() lista as
   diferenças entre ele e o documento atual — por item e por campo de primeiro
   nível, para não sobrescrever um item inteiro — e cada diferença sabe se
   aplicar num clone. A administração marca as que quer; "Adotar selecionadas"
   aplica as marcadas, em ordem, pelo portão tentarEstado(). A ORDEM das listas
   não é proposta (reordena-se no painel Estrutura). */
function diffEstado(A, P) {
  const mud = [];
  const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const curto = t => { t = String(t); return t.length > 60 ? t.slice(0, 57) + "…" : t; };
  const add = (secao, rotulo, aplicar) => mud.push({ secao, rotulo, aplicar });
  // objeto simples, por campo
  const porCampo = (secao, caminho, campos) => {
    const a = getPath(A, caminho), p = getPath(P, caminho);
    campos.forEach(k => { if (!igual(a[k], p[k])) add(secao, `~ ${k}: "${curto(p[k])}"`, c => { getPath(c, caminho)[k] = clone(p[k]); }); });
  };
  // lista de objetos com chave (id; nas normas, o título + nº da ocorrência se repetido)
  const chaves = (arr, campo) => { const n = new Map(); return arr.map(x => { const b = String(x[campo]); n.set(b, (n.get(b) || 0) + 1); return n.get(b) > 1 ? `${b}#${n.get(b)}` : b; }); };
  const porChave = (secao, caminho, campo, nome, rotuloDe) => {
    const a = getPath(A, caminho), p = getPath(P, caminho);
    const ma = new Map(chaves(a, campo).map((k, i) => [k, a[i]])), mp = new Map(chaves(p, campo).map((k, i) => [k, p[i]]));
    const onde = (c, k) => chaves(getPath(c, caminho), campo).indexOf(k);
    mp.forEach((x, k) => {
      if (!ma.has(k)) { add(secao, `+ ${nome} "${curto(rotuloDe(x))}"`, c => { getPath(c, caminho).push(clone(x)); }); return; }
      const y = ma.get(k);
      new Set([...Object.keys(y), ...Object.keys(x)]).forEach(f => {
        if (f === "__proto__" || igual(y[f], x[f])) return; // chave literal "__proto__" de um arquivo nunca é aplicada
        add(secao, `~ ${nome} "${curto(rotuloDe(y))}": ${f}`, c => {
          const i = onde(c, k); if (i < 0) return;
          const it = getPath(c, caminho)[i];
          if (x[f] === undefined) delete it[f]; else it[f] = clone(x[f]);
        });
      });
    });
    ma.forEach((y, k) => { if (!mp.has(k)) add(secao, `− ${nome} "${curto(rotuloDe(y))}"`, c => { const i = onde(c, k); if (i >= 0) getPath(c, caminho).splice(i, 1); }); });
  };
  porCampo("Identidade", "meta", ["titulo", "icone", "subtitulo"]);
  // o modelo antes de blocos e normas: adotar um grupo/elo novo vem antes de quem o usa
  porChave("Vistas", "modelo.vistas", "id", "vista", x => x.rotulo);
  porChave("Grupos", "modelo.grupos", "id", "grupo", x => x.etiqueta);
  porChave("Sistemas de contexto", "modelo.sistemas", "id", "sistema", x => x.nome);
  porChave("Elos", "modelo.elos", "id", "elo", x => x.abrev);
  porCampo("Ecossistema", "modelo.ecossistema", ["nucleo", "nota", "semItem", "dicaChip"]);
  porChave("Blocos", "blocos", "id", "bloco", x => x.nome);
  porChave("Normas", "normas", "titulo", "norma", x => x.titulo);
  const na = new Set(A.notas), np = new Set(P.notas);
  P.notas.forEach(t => { if (!na.has(t)) add("Notas", `+ nota "${curto(t)}"`, c => { c.notas.push(t); }); });
  A.notas.forEach(t => { if (!np.has(t)) add("Notas", `− nota "${curto(t)}"`, c => { const i = c.notas.indexOf(t); if (i >= 0) c.notas.splice(i, 1); }); });
  const temA = k => Object.prototype.hasOwnProperty.call(A.siglas, k), temP = k => Object.prototype.hasOwnProperty.call(P.siglas, k);
  Object.keys(P.siglas).forEach(k => {
    if (k === "__proto__") return;
    if (!temA(k)) add("Siglas", `+ sigla ${k}`, c => { c.siglas[k] = clone(P.siglas[k]); });
    else if (!igual(A.siglas[k], P.siglas[k])) add("Siglas", `~ sigla ${k}`, c => { c.siglas[k] = clone(P.siglas[k]); });
  });
  Object.keys(A.siglas).forEach(k => { if (!temP(k)) add("Siglas", `− sigla ${k}`, c => { delete c.siglas[k]; }); });
  return mud;
}
async function abrirProposta(file) {
  if (!file) return;
  const lido = await lerEstadoDeArquivo(file);
  if (!lido) return;
  proposta = diffEstado(state, lido.estado);
  abrirDrawerModo({ proposta: true });
}
function renderPropostaContent() {
  const tag = document.getElementById("drawer-tag");
  tag.textContent = "Proposta"; tag.style.background = "var(--surface-2)"; tag.style.color = "var(--ink-soft)";
  const nameEl = document.getElementById("drawer-name");
  nameEl.textContent = "Comparar proposta";
  nameEl.removeAttribute("contenteditable");
  nameEl.removeAttribute("data-path");
  const body = document.getElementById("drawer-body");
  const foot = document.getElementById("drawer-foot");
  foot.replaceChildren();
  if (!proposta.length) { body.replaceChildren(el("p", { class: "drawer-lede" }, "A proposta é igual ao documento atual.")); return; }
  body.replaceChildren(
    el("p", { class: "drawer-lede" }, `${proposta.length} diferença${proposta.length === 1 ? "" : "s"} em relação ao documento atual. Marque as que devem entrar (+ novo, − removido, ~ alterado).`),
    el("div", { class: "est-bar" }, [
      el("button", { class: "link-btn", type: "button", "data-prop-todas": "1" }, "marcar todas"),
      el("button", { class: "link-btn", type: "button", "data-prop-todas": "0" }, "desmarcar todas")]));
  let secao = null, bloco = null;
  proposta.forEach((m, i) => {
    if (m.secao !== secao) { secao = m.secao; bloco = el("div", { class: "est-sec" }, el("h3", { class: "panel-label" }, secao)); body.appendChild(bloco); }
    bloco.appendChild(el("label", { class: "est-ctrl" }, [el("input", { type: "checkbox", "data-prop-i": String(i) }), " " + m.rotulo]));
  });
  foot.appendChild(el("button", { class: "btn btn-block", type: "button", id: "adotar-btn" }, "Adotar selecionadas"));
}
function adotarProposta() {
  const sel = [...document.querySelectorAll("#drawer-body [data-prop-i]")].filter(x => x.checked).map(x => proposta[Number(x.getAttribute("data-prop-i"))]);
  if (!sel.length) { setStatus("Nenhuma mudança selecionada."); return; }
  const antes = JSON.stringify(state);
  if (!tentarEstado(c => sel.forEach(m => m.aplicar(c)))) {
    setStatus("Alteração recusada: a combinação escolhida não forma um documento válido (ex.: um bloco que usa um grupo novo exige adotar o grupo também).");
    return;
  }
  undoSnapshot = antes;
  SIGLA_RE = null; // as siglas podem ter mudado
  renderAll();
  closeDrawer();
  updateEditControls();
  setStatus(`${sel.length} mudança${sel.length === 1 ? " adotada" : "s adotadas"}.`);
}

/* ---------- aviso modal ----------
   Um único modal (#modal), para dois usos: a apresentação do documento na
   primeira visita (meta.apresentacao; também em "Sobre este documento") e o
   aviso de que a cópia salva neste navegador é de outra versão do conteúdo.
   Foco preso dentro dele; Esc só fecha o que pode ser dispensado. */
let modalDispensavel = false, modalAoFechar = null, modalOpener = null;
function abrirModal({ titulo, paragrafos = [], links = [], botoes, dispensavel = true, aoFechar = null }) {
  modalOpener = document.activeElement;
  modalDispensavel = dispensavel; modalAoFechar = aoFechar;
  const card = document.getElementById("modal-card");
  card.replaceChildren(el("h2", { id: "modal-titulo" }, titulo), ...paragrafos.map(t => el("p", {}, t)));
  const ok = links.map(l => ({ l, href: safeHref(l.url) })).filter(x => x.href);
  if (ok.length) card.appendChild(el("ul", { class: "modal-links" }, ok.map(({ l, href }) =>
    el("li", {}, el("a", { href, target: "_blank", rel: "noopener noreferrer" }, l.rotulo + " ↗")))));
  const acoes = el("div", { class: "modal-acoes" });
  botoes.forEach(b => {
    const btn = el("button", { type: "button", class: "btn" + (b.primario ? " btn-primary" : ""), "data-modal-acao": b.id || "" }, b.rotulo);
    btn.addEventListener("click", () => { fecharModal(false); if (b.acao) b.acao(); });
    acoes.appendChild(btn);
  });
  card.appendChild(acoes);
  document.getElementById("modal").hidden = false;
  focusLater(".modal-acoes .btn-primary");
}
function fecharModal(chamarAoFechar = true) {
  const m = document.getElementById("modal");
  if (m.hidden) return;
  m.hidden = true;
  const cb = modalAoFechar; modalAoFechar = null;
  if (modalOpener && modalOpener.focus) modalOpener.focus();
  if (chamarAoFechar && cb) cb();
}
document.addEventListener("keydown", e => {
  const m = document.getElementById("modal");
  if (m.hidden) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); if (modalDispensavel) fecharModal(); return; }
  if (e.key === "Tab") {
    const f = [...m.querySelectorAll("a[href], button")];
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
    e.stopPropagation();
  }
}, true);

// Apresentação: na primeira visita a este documento neste navegador (marca em
// localStorage, por documento); depois, pelo link "Sobre este documento".
const VISITA_KEY = SEED.meta.slug + ":visitado";
function jaVisitou() { try { return localStorage.getItem(VISITA_KEY) === "1"; } catch (e) { return false; } }
function marcarVisita() { try { localStorage.setItem(VISITA_KEY, "1"); } catch (e) { /* sem armazenamento: a apresentação volta na próxima visita */ } }
function mostrarApresentacao() {
  const a = state.meta.apresentacao;
  if (!a) return;
  abrirModal({ titulo: a.titulo, paragrafos: a.paragrafos, links: a.links || [], botoes: [{ id: "ok", rotulo: a.botao, primario: true, acao: marcarVisita }], aoFechar: marcarVisita });
}
function atualizarSobre() { document.getElementById("sobre-btn").hidden = !state.meta.apresentacao; }

// Cópia salva de outra versão: perguntar antes de trocá-la pela publicada. Até a
// escolha, a cópia antiga continua guardada (fechar a aba não perde nada).
function avisarVersaoDiferente(salvo, depois) {
  const sincronizar = async () => { await doSave(); setStatus("Sincronizado com a versão publicada."); depois(); };
  abrirModal({
    titulo: "Este documento foi atualizado",
    paragrafos: [
      "A versão publicada mudou desde a última vez que você editou este documento neste navegador. As suas alterações locais são de uma versão anterior.",
      "Você pode exportá-las num arquivo (que pode ser enviado à equipe responsável como proposta de mudança) e então passar para a versão publicada, ou passar direto para a versão publicada, descartando-as.",
    ],
    dispensavel: false,
    botoes: [
      { id: "sincronizar", rotulo: "Sincronizar sem exportar", acao: sincronizar },
      { id: "exportar", rotulo: "Exportar minhas alterações e sincronizar", primario: true,
        acao: async () => { await baixar(SEED.meta.slug + "-alteracoes-locais.json", JSON.stringify(salvo, null, 2), "application/json"); sincronizar(); } },
    ],
  });
}

/* ---------- persistência: capacidade db, com alternativa local ---------- */
// O slug vem SEMPRE da semente (meta.json do build), nunca do estado nem de um
// arquivo importado: é ele que decide onde este documento guarda os dados no
// navegador, e um arquivo de fora não pode redirecionar esse armazenamento.
const LOCAL_KEY = SEED.meta.slug + ":content/main";
function makeLocalDb() {
  return {
    doc: () => ({
      get: async () => {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (raw == null) return { exists: false, data: () => undefined };
        return { exists: true, data: () => JSON.parse(raw) };
      },
      set: async (data) => { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); },
    }),
  };
}
let saveTimer = null, saving = false, pendingAgain = false;
function scheduleSave() {
  setStatus(dbMode ? "Salvando…" : "");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 600);
}
async function doSave() {
  if (!db) { setStatus("Alterações não são salvas nesta janela"); return; }
  if (saving) { pendingAgain = true; return; }
  saving = true;
  const prevAtualizado = state.meta.atualizado;
  state.meta.atualizado = new Date().toISOString().slice(0, 10);
  try {
    // Salva junto a versão do build atual (ver SEED_VERSION) -- é o que
    // permite ao init() da próxima visita saber se este salvamento já está
    // desatualizado em relação a um conteúdo publicado depois dele.
    await db.doc("content/main").set({ version: SEED_VERSION, state });
    setStatus(pendingAgain ? "Salvando…" : (dbMode === "local" ? "Salvo neste navegador" : "Salvo"));
  } catch (err) {
    state.meta.atualizado = prevAtualizado; // o salvamento falhou -- não finge que atualizou
    setStatus("Não foi possível salvar");
  } finally {
    saving = false;
    if (pendingAgain) { pendingAgain = false; scheduleSave(); }
  }
}
// Sem isto, fechar a aba (ou trocar de app no celular) logo depois de digitar
// perdia a última edição: scheduleSave() espera 600ms antes de salvar, e nada
// cancelava essa espera quando a página ia para segundo plano. pagehide cobre
// fechar/navegar para fora; visibilitychange cobre trocar de aba/app sem
// fechar (em geral o único dos dois que ainda tem tempo de completar o save).
function flushPendingSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; doSave(); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPendingSave(); });
window.addEventListener("pagehide", flushPendingSave);
async function getCap(name) {
  if (!window.claude || typeof window.claude.use !== "function") return null;
  try { return await window.claude.use(name); } catch (e) { return null; }
}
async function init() {
  let desatualizado = null; // a cópia salva, quando é de outra versão do conteúdo
  db = await getCap("db");
  dbMode = db ? "cloud" : null;
  if (!db) {
    try { localStorage.getItem(LOCAL_KEY); db = makeLocalDb(); dbMode = "local"; }
    catch (e) { db = null; dbMode = null; }
  }
  downloadsCap = await getCap("downloads");
  if (db) {
    try {
      let snap;
      try { snap = await db.doc("content/main").get(); }
      catch (e) { await new Promise(r => setTimeout(r, 500 + Math.random() * 400)); snap = await db.doc("content/main").get(); }
      if (snap.exists) {
        const raw = snap.data();
        // Salvamentos de antes de SEED_VERSION existir guardavam o próprio
        // estado sem embrulho -- tratados como versão desconhecida, o que
        // cai direto no "prioriza a semente nova" abaixo (certo: são
        // exatamente os navegadores que ficaram presos numa cópia antiga).
        const wrapped = raw && typeof raw === "object" && typeof raw.version === "string" && raw.state && typeof raw.state === "object";
        const savedVersion = wrapped ? raw.version : null;
        const savedState = wrapped ? raw.state : raw;
        if (savedVersion === SEED_VERSION) {
          state = Object.assign({}, cloneSeed(), savedState);
        } else {
          // O conteúdo publicado mudou desde o último salvamento feito neste
          // navegador (ou não há como saber, por ser de antes de existir essa
          // marca de versão) -- prioriza a versão nova em vez de uma cópia
          // local possivelmente desatualizada. É isto que faz uma correção de
          // conteúdo (ex.: um link consertado) chegar a quem já tinha editado
          // algo neste navegador antes, inclusive num hard refresh: sem isto,
          // o Object.assign acima substituiria cada array (blocos/normas/
          // notas/siglas) pela versão salva, por mais antiga que estivesse,
          // para sempre -- até alguém lembrar de clicar em "Restaurar".
          state = cloneSeed();
          desatualizado = savedState; // a página mostra a versão publicada; a cópia antiga só é substituída depois da escolha (avisarVersaoDiferente)
        }
        currentView = state.modelo.vistas[0].id; // a vista inicial é a primeira das vistas do estado carregado (podem ter sido reordenadas)
        renderAll();
      }
    } catch (e) { /* mantém a semente */ }
  }
  updateEditControls();
  const apresentar = () => { if (!jaVisitou()) mostrarApresentacao(); };
  if (desatualizado) avisarVersaoDiferente(desatualizado, apresentar);
  else apresentar();
}

/* ---------- início ---------- */
renderAll();
init();
</script>
